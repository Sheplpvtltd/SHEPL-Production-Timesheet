function updateDraft(key, field, val){
  entryDraft[key] = entryDraft[key] || {...rowValuesByKey(key)};
  entryDraft[key][field] = val;
  renderApp();
}
function rowValuesByKey(key){
  const d = DB.drafts[key];
  const o = {};
  if(d && d.pairs) d.pairs.forEach((pr,i)=>{ o['p'+(i+1)]=pr.p||''; o['h'+(i+1)]=pr.h||''; });
  return o;
}
function collectPairs(v){
  return [1,2,3,4,5,6].map(i=>({p:String(v['p'+i]||'').trim(), h:v['h'+i]===''||v['h'+i]==null? null : Number(v['h'+i])}));
}
function validateRow(emp, pairs){
  const errs = [];
  const filled = pairs.filter(pr=>pr.p || (pr.h!=null && pr.h!==0));
  const seen = new Set();
  let total = 0;
  for(const pr of filled){
    if(pr.p && (pr.h==null || pr.h===0)) errs.push(`${emp.empCode}: Project ${pr.p} has no hours — enter hours or clear the Project ID.`);
    if(!pr.p && pr.h!=null && pr.h>0) errs.push(`${emp.empCode}: Hours entered without selecting a Project ID.`);
    if(pr.h!=null && (isNaN(pr.h) || pr.h<0)) errs.push(`${emp.empCode}: Invalid hours "${pr.h}" — numbers only, no negatives.`);
    if(pr.p){
      if(seen.has(pr.p)) errs.push(`${emp.empCode}: This Project ID has already been selected in this Daily Entry. Please select a different project. (${pr.p})`);
      seen.add(pr.p);
      if(!permittedProjects().find(x=>String(x.code)===pr.p)) errs.push(`${emp.empCode}: Project "${pr.p}" is not an active/permitted project.`);
    }
    if(pr.p && pr.h>0) total += pr.h;
  }
  if(total > (DB.settings.maxDailyHours||24)) errs.push(`${emp.empCode}: Total ${total} hrs exceeds the daily limit of ${DB.settings.maxDailyHours} hrs.`);
  if(emp.status!=='Active') errs.push(`${emp.empCode}: Employee is not Active.`);
  return {errs, valid: filled.filter(pr=>pr.p && pr.h>0), total};
}
async function saveDraftAll(){
  if(!(can('save_draft','dailyentry')||can('add','dailyentry'))){ toast('You do not have Save Draft permission', true); return; }
  let saved = 0;
  for(const emp of entryEmployees()){
    const key = draftKey(emp.empCode);
    if(!entryDraft[key]) continue;                       // untouched row
    if(DB.drafts[key] && DB.drafts[key].status==='Submitted'){ continue; }
    const pairs = collectPairs(entryDraft[key]);
    if(!pairs.some(pr=>pr.p || pr.h)){ delete DB.drafts[key]; continue; }
    DB.drafts[key] = {empId:emp.empCode, date:window.__entryDate,
      pairs: pairs.map(pr=>({p:pr.p, h:pr.h==null?'':pr.h})),
      status:'Draft', updatedBy:SESSION.name, updatedAt:new Date().toISOString()};
    await logActivity('DRAFT_SAVED', `Daily Entry draft saved for ${emp.empCode} (${emp.name}) on ${fmtDate(window.__entryDate)}`, {page:'Daily Entry', recordId:key});
    saved++;
  }
  await save('drafts');
  entryDraft = {};
  toast(saved? `Draft saved for ${saved} row(s) — visible only on this page until submitted` : 'No changes to save');
  renderApp();
}
function confirmSubmit(){
  if(!can('submit','dailyentry')){ toast('You do not have Submit permission', true); return; }
  // pre-validate to fail fast
  const candidates = [];
  const allErrs = [];
  for(const emp of entryEmployees()){
    const key = draftKey(emp.empCode);
    const status = rowStatus(emp);
    if(status==='Submitted') continue;                    // never resubmit — duplicate protection
    const v = entryDraft[key] || rowValuesByKey(key);
    const pairs = collectPairs(v);
    if(!pairs.some(pr=>pr.p || pr.h)) continue;
    const {errs, valid} = validateRow(emp, pairs);
    if(errs.length) allErrs.push(...errs);
    else if(valid.length) candidates.push({emp, key, valid, pairs});
  }
  if(allErrs.length){
    showBulkResult({created:0,updated:0,skipped:0,errors:allErrs.map((e,i)=>({row:'-',col:'-',reason:e,fix:'Correct this and try again'})),warnings:[],noun:'entr(ies)'});
    return;
  }
  if(!candidates.length){ toast('Nothing to submit — enter project hours first (already-submitted rows are skipped)', true); return; }
  document.getElementById('modalRoot')?.remove();
  const div = document.createElement('div'); div.id='modalRoot';
  div.innerHTML = `<div class="modal-bg" onclick="if(event.target===this) this.remove()">
    <div class="modal">
      <h3>Confirm Submission</h3>
      <p style="font-size:13.5px;">Are you sure you want to submit this daily entry? After submission, the entry will be reflected in the Timesheet page.</p>
      <p style="font-size:12.5px;color:var(--muted);">${candidates.length} row(s) will be submitted for ${fmtDate(window.__entryDate)}. Submitted rows lock and cannot be edited unless an Admin reopens them.</p>
      <div class="modal-actions">
        <button class="btn btn-ghost" onclick="document.getElementById('modalRoot')?.remove()">Cancel</button>
        <button class="btn btn-primary" onclick="document.getElementById('modalRoot')?.remove(); submitEntries();">Yes, Submit</button>
      </div>
    </div></div>`;
  document.body.appendChild(div);
}
async function submitEntries(){
  let submitted = 0, rowsCreated = 0;
  const month = monthOf(window.__entryDate);
  await tsEnsureMonths([month]);
  const newRows = []; const clearKeys = new Set();
  for(const emp of entryEmployees()){
    const key = draftKey(emp.empCode);
    if(rowStatus(emp)==='Submitted') continue;
    const v = entryDraft[key] || rowValuesByKey(key);
    const pairs = collectPairs(v);
    if(!pairs.some(pr=>pr.p || pr.h)) continue;
    const {errs, valid} = validateRow(emp, pairs);
    if(errs.length || !valid.length) continue;
    clearKeys.add(key); // duplicate protection: withdraw any rows previously created from this key
    valid.forEach(pr=>{
      newRows.push({
        id:'T'+Date.now()+Math.random().toString(36).slice(2,7),
        date: window.__entryDate, empId: emp.empCode, designation: emp.designation||'',
        rate: emp.rate||0, name: emp.name, projectId: pr.p, hours: pr.h,
        managerId: emp.managerId || null, departmentId: emp.departmentId || null,
        sourceKey: key, submittedBy: SESSION.name, submittedAt: new Date().toISOString(), batchId:'B'+Date.now()
      });
      rowsCreated++;
    });
    DB.drafts[key] = {empId:emp.empCode, date:window.__entryDate,
      pairs: pairs.map(pr=>({p:pr.p, h:pr.h==null?'':pr.h})),
      status:'Submitted', submittedBy:SESSION.name, submittedAt:new Date().toISOString()};
    await logActivity('SUBMIT', `Daily Entry submitted for ${emp.empCode} (${emp.name}) on ${fmtDate(window.__entryDate)} — ${valid.length} project row(s) created on Timesheet`, {page:'Daily Entry', recordId:key});
    submitted++;
  }
  if(clearKeys.size) await tsRemoveWhere(month, t=>clearKeys.has(t.sourceKey));
  if(newRows.length) await tsAppend(newRows);
  await save('drafts');
  entryDraft = {};
  toast(`Submitted ${submitted} entr(ies) — ${rowsCreated} Timesheet row(s) created`);
  renderApp();
}
async function reopenEntry(key){
  if(!(isAdmin() || can('reopen','dailyentry'))){ toast('Only an Admin can reopen a submitted entry', true); return; }
  const d = DB.drafts[key];
  if(!d || d.status!=='Submitted') return;
  const month = monthOf(key.slice(-10));
  await tsEnsureMonths([month]);
  const oldRows = await tsRemoveWhere(month, t=>t.sourceKey===key);
  d.status = 'Draft'; d.reopenedBy = SESSION.name; d.reopenedAt = new Date().toISOString();
  await save('drafts');
  await logActivity('REOPEN', `Submitted entry ${key} returned to Draft by ${SESSION.name} — ${oldRows.length} Timesheet row(s) withdrawn (original values: ${oldRows.map(r=>r.projectId+':'+r.hours+'h').join(', ')||'none'})`, {page:'Daily Entry', recordId:key, changes: oldRows.map(r=>({field:'timesheet '+r.projectId, oldValue:r.hours+' hrs', newValue:'withdrawn to draft'}))});
  toast('Entry reopened — it is a Draft again and its Timesheet rows were withdrawn (recorded in the audit log)');
  renderApp();
}
async function deleteOneDraft(key, empCode){
  askConfirm('Delete this draft?', 'Draft for '+empCode+' on '+fmtDate(window.__entryDate)+' will be removed.', async ()=>{
    delete DB.drafts[key];
    await save('drafts');
    await logActivity('DELETE', 'Daily Entry draft deleted for '+empCode+' on '+fmtDate(window.__entryDate), {page:'Daily Entry', recordId:key});
    toast('Draft deleted');
    renderApp();
  });
}
async function deleteDrafts(){
  if(!can('delete','dailyentry') && !isAdmin()){ toast('You do not have Delete permission', true); return; }
  const keys = Object.keys(DB.drafts).filter(k=>{
    const d = DB.drafts[k];
    return d.date===window.__entryDate && d.status==='Draft' && entryEmployees().some(e=>e.empCode===d.empId);
  });
  if(!keys.length){ toast('No drafts to delete for this date (submitted entries are not deleted here)', true); return; }
  for(const k of keys){
    await logActivity('DELETE', `Daily Entry draft deleted for ${DB.drafts[k].empId} on ${fmtDate(window.__entryDate)}`, {page:'Daily Entry', recordId:k});
    delete DB.drafts[k];
  }
  await save('drafts');
  entryDraft = {};
  toast(`${keys.length} draft(s) deleted`);
  renderApp();
}

/* =========================================================
   PROJECT SUMMARY REPORT — project-wise hours & cost for a
   date range, computed entirely from the summary pages.

   ========================================================= */
function renderRptSummary(){
  if(!pageAllowed('rpt_summary')){ VIEW='dashboard'; return renderDashboard(); }
  if(window.__psFrom===undefined) window.__psFrom='';
  if(window.__psTo===undefined) window.__psTo='';
  if(!window.__psPend) window.__psPend = {from:window.__psFrom, to:window.__psTo};
  const pp = window.__psPend;
  const hb = hybridMonths(window.__psFrom||null, window.__psTo||null);
  if(!hybridReady(window.__psFrom||null, window.__psTo||null)){
    kickHybrid(window.__psFrom||null, window.__psTo||null);
    return renderShell(loadingCard('⏳ Reading report summaries — a few seconds…'), '📊 Project Summary Report', 'Reading summary pages…');
  }
  const acc = {}; const missing = [];
  hb.full.forEach(m=>{
    const a = AGG.docs[m];
    if(!a){ if(TS.manifest && (TS.manifest.parts[m]||0)>0) missing.push(m); return; }
    for(const [p, peo] of Object.entries(a.pe)){
      let h=0, c=0;
      for(const x of Object.values(peo)){ h+=x[0]; c+=x[1]; }
      const t = acc[p] = acc[p]||[0,0];
      t[0]+=h; t[1]+=c;
    }
  });
  hb.part.forEach(m=>{ /* edge months: exact to the day, from raw pages */
    partialMonthRows(m, window.__psFrom||null, window.__psTo||null).forEach(r=>{
      const t = acc[String(r.projectId)] = acc[String(r.projectId)]||[0,0];
      t[0]+=Number(r.hours||0); t[1]+=Number(r.hours||0)*Number(r.rate||0);
    });
  });
  const list = Object.entries(acc).map(([proj,[h,c]])=>({proj, name:projName(proj), hrs:+h.toFixed(2), cost:+c.toFixed(2), rate:h?+(c/h).toFixed(2):0}))
    .sort((a,b)=>b.cost-a.cost);
  const totalHrs = list.reduce((s,x)=>s+x.hrs,0), totalCost = list.reduce((s,x)=>s+x.cost,0);
  const rcS = visibleCols('rpt_summary');
  const hasCostS = rcS.some(c=>c.key==='cost');
  window.__psExport = list.map(x=> Object.fromEntries(rcS.map(c=>[c.label, x[c.key]])));
  const missingNote = missing.length? `<div class="err-list">⚠️ Summaries missing for ${missing.length} month(s) (${missing.slice(0,6).join(', ')}${missing.length>6?'…':''}) — excluded from totals. Ask an Admin to open <b>Backup &amp; Export → 🧮 Rebuild Report Summaries</b> once.</div>` : '';
  const html = `
    <div class="toolbar">
      <div class="field"><label>From (optional)</label><input type="date" value="${pp.from}" onchange="window.__psPend.from=this.value;"></div>
      <div class="field"><label>To (optional)</label><input type="date" value="${pp.to}" onchange="window.__psPend.to=this.value;"></div>
      <button class="btn btn-primary" onclick="window.__psFrom=window.__psPend.from; window.__psTo=window.__psPend.to; renderApp();">🔍 Search</button>
      ${(isAdmin()||can('export','rpt_summary'))?'<button class="btn btn-ghost" onclick="exportRptSummaryExcel()">⬇️ Export (Excel)</button>':''}
      <div class="field"><label>&nbsp;</label><span style="font-size:11px;color:var(--muted);align-self:center;">Leave both dates blank + Search = all time</span></div>
    </div>
    ${missingNote}
    <div class="kpi-row">
      <div class="kpi"><div class="lbl">Projects</div><div class="val">${list.length}</div></div>
      <div class="kpi"><div class="lbl">Total Hrs</div><div class="val">${totalHrs.toFixed(1)}</div></div>
      ${hasCostS?`<div class="kpi"><div class="lbl">Total Cost</div><div class="val">${fmtMoney(totalCost)}</div></div>`:''}
    </div>
    <div class="card"><h2>📊 Project-wise Hours${hasCostS?' &amp; Cost':''}</h2>
      <div class="table-scroll"><table>
        <thead><tr>${rcS.map(c=>`<th>${c.label}</th>`).join('')}</tr></thead>
        <tbody>${list.length? list.map(x=>`<tr>${rcS.map(c=>{
          if(c.key==='proj') return '<td class="grid-code">'+x.proj+'</td>';
          if(c.key==='rate'||c.key==='cost') return '<td>'+fmtMoney(x[c.key])+'</td>';
          return '<td>'+(x[c.key]??'—')+'</td>';
        }).join('')}</tr>`).join('') : `<tr><td colspan="${rcS.length}"><div class="empty-state">No project data in this period.</div></td></tr>`}</tbody>
      </table></div>
    </div>
    ${list.length?`<div class="card"><h2>Top Projects by ${hasCostS?'Cost':'Hours'}${list.length>25?' (top 25 shown)':''}</h2>${barChart(list.slice(0,25).map(x=>({label:String(x.proj),value:hasCostS?x.cost:x.hrs})))}</div>`:''}`;
  renderShell(html, '📊 Project Summary Report', 'Every project\'s hours & cost for your chosen period');
}

async function renameDept(id){
  const d = DB.departments.find(x=>x.id===id);
  const n = prompt('New department name:', d.name);
  if(!n || !n.trim()) return;
  const old = d.name; d.name = n.trim();
  await save('departments');
  await logActivity('UPDATE', `Department renamed: "${old}" → "${d.name}"`, {page:'Department Management', recordId:id, changes:[{field:'name', oldValue:old, newValue:d.name}]});
  toast('Department renamed'); renderApp();
}
async function addDept(){
  const name = document.getElementById('newDeptName').value.trim();
  if(!name){ toast('Type a department name', true); return; }
  if(DB.departments.find(d=>d.name.toLowerCase()===name.toLowerCase())){ toast('Department already exists', true); return; }
  const id = 'D'+Date.now();
  DB.departments.push({id, name, pages: PAGES.map(p=>p.id), cols:{}}); // default: all pages, all columns
  await save('departments');
  await logActivity('CREATE', `Department "${name}" created`);
  toast('Department added — click Edit Access to set permissions');
  renderApp();
}
async function deleteDept(id){
  const d = DB.departments.find(x=>x.id===id);
  if(DB.users.some(u=>u.departmentId===id)){ toast('Reassign this department\'s users first', true); return; }
  DB.departments = DB.departments.filter(x=>x.id!==id);
  DB.employees.forEach(e=>{ if(e.departmentId===id) e.departmentId=null; });
  await save('departments'); await save('employees');
  await logActivity('DELETE', `Department "${d.name}" deleted`);
  toast('Department deleted'); renderApp();
}

    let sec = firebase.apps.find(a=>a.name==='secondary');
    if(!sec) sec = firebase.initializeApp(FIREBASE_CONFIG, 'secondary');
    await sec.auth().createUserWithEmailAndPassword(email, pw);
    await sec.auth().signOut();
    return {ok:true};
  }catch(e){
    if(e.code==='auth/email-already-in-use') return {ok:true, existed:true};
    return {ok:false, msg:e.message||e.code};
  }
}
async function addUser(){
  const empId = document.getElementById('u_empId').value.trim();
  const name = document.getElementById('u_name').value.trim();
  const email = document.getElementById('u_email').value.trim().toLowerCase();
  const pw = document.getElementById('u_pw').value;
  const role = document.getElementById('u_role').value;
  const dept = document.getElementById('u_dept').value;
  const scope = document.getElementById('u_scope').value;
  if(!name || !email){ toast('Name and email are required', true); return; }
  if(pw.length<6){ toast('Temporary password must be at least 6 characters', true); return; }
  if(DB.users.find(x=>String(x.email||'').toLowerCase()===email)){ toast('A user with this email already exists', true); return; }
  if(role==='user' && !dept){ toast('Assign a department to this user', true); return; }
  const emp = DB.employees.find(e=>e.empCode===empId);
  const res = await createAuthAccount(email, pw);
  if(!res.ok){ toast('Could not create login: '+res.msg, true); return; }
  DB.users.push({uid:'U'+Date.now(), name, email, empId: empId||null,
    designation: emp?emp.designation:null, managerId: emp?emp.managerId:null,
    role, departmentId: role==='user'?dept:null, scope: role!=='user'?'all':scope,
    status:'Active', mustChangePassword:true, pwHash: FB_MODE? null : hashPw(pw),
    createdAt:new Date().toISOString(), createdBy:SESSION.name});
  await save('users');
  await logActivity('USER_CREATED', `User "${name}" (${email}) created — role ${role}${role==='user'?', '+deptName(dept)+', scope '+scope:''}`, {page:'User Management', recordId:email});
  toast('User created — share the email and temporary password with them privately');
  renderApp();
}
function openUserModal(uid){

  document.getElementById('modalRoot')?.remove();

    <div class="modal">
      <h3>Edit User — ${u.name}</h3>

      <div class="field"><label>Employee ID (link)</label><input id="eu_empId" list="empDL" value="${u.empId||''}"></div>
      <div class="field"><label>Role</label><select id="eu_role"><option value="user" ${u.role==='user'?'selected':''}>Department User</option><option value="admin" ${u.role==='admin'?'selected':''}>Admin</option><option value="director" ${u.role==='director'?'selected':''}>Director (full access)</option></select></div>
      <div class="field"><label>Department</label><select id="eu_dept">${deptOpts}</select></div>
      <div class="field"><label>Data scope</label><select id="eu_scope">
        ${['own','team','department','all'].map(s=>`<option value="${s}" ${(u.scope||'own')===s?'selected':''}>${s}</option>`).join('')}</select></div>
      <div class="field"><label>Account status</label><select id="eu_status">
        ${['Active','Suspended','Deactivated'].map(s=>`<option ${(u.status||'Active')===s?'selected':''}>${s}</option>`).join('')}</select></div>
      <div class="modal-actions">
        <button class="btn btn-ghost" onclick="document.getElementById('modalRoot')?.remove()">Cancel</button>
        <button class="btn btn-primary" onclick="saveUser('${uid}')">Save</button>
      </div>
    </div></div>`;

async function saveUser(uid){
  const u = DB.users.find(x=>x.uid===uid);
  const before = {...u};
  u.name = document.getElementById('eu_name').value.trim() || u.name;
  u.empId = document.getElementById('eu_empId').value.trim() || null;
  u.role = document.getElementById('eu_role').value;
  u.departmentId = u.role==='user' ? (document.getElementById('eu_dept').value||null) : null;
  u.scope = u.role!=='user' ? 'all' : document.getElementById('eu_scope').value;
  u.status = document.getElementById('eu_status').value;
  const emp = DB.employees.find(e=>e.empCode===u.empId);
  if(emp){ u.designation = emp.designation; u.managerId = emp.managerId; }
  await save('users');
  const ch = diffChanges(before, u, ['name','empId','role','departmentId','scope','status']);
  await logActivity('USER_UPDATED', `User "${u.name}" updated`+(ch?' — '+ch.map(c=>`${c.field}: "${c.oldValue}" → "${c.newValue}"`).join('; '):''), {page:'User Management', recordId:u.email, changes:ch});
  document.getElementById('modalRoot')?.remove();
  toast('User updated'+((u.status!=='Active')?' — they can no longer sign in':''));
  renderApp();
}
async function resetUserPassword(uid){
  const u = DB.users.find(x=>x.uid===uid);
  if(FB_MODE){
    try{
      await firebase.auth().sendPasswordResetEmail(u.email);
      await logActivity('PASSWORD_RESET', `Password reset email sent to ${u.email} by ${SESSION.name}`, {page:'User Management', recordId:u.email});
      toast('Password reset email sent to '+u.email);
    }catch(e){ toast('Could not send reset email: '+(e.message||e.code), true); }
    return;
  }
  const np = prompt('Enter a new temporary password for '+u.name+' (min 6 characters):');
  if(!np) return;
  if(np.length<6){ toast('Minimum 6 characters', true); return; }
  u.pwHash = hashPw(np); u.mustChangePassword = true;
  await save('users');
  await logActivity('PASSWORD_RESET', `Temporary password set for ${u.email} by ${SESSION.name} (change forced on next login)`, {page:'User Management', recordId:u.email});
  toast('Temporary password set — user must change it on next login');
}
function showUserHistory(uid){
  const u = DB.users.find(x=>x.uid===uid);
  const events = DB.activity.filter(a=> (a.user===u.name || a.recordId===u.email || a.recordId===u.uid) &&
    ['LOGIN','LOGOUT','FAILED_LOGIN','PASSWORD_RESET','PASSWORD_CHANGE','USER_CREATED','USER_UPDATED','PERMISSION_CHANGE'].includes(a.action)).slice(0,50);
  document.getElementById('modalRoot')?.remove();
  const div = document.createElement('div'); div.id='modalRoot';
  div.innerHTML = `<div class="modal-bg" onclick="if(event.target===this) this.remove()">
    <div class="modal" style="max-width:560px;">
      <h3>🕒 Login & Account History — ${u.name}</h3>
      ${events.length? events.map(a=>`<div class="actlog-row"><div class="actlog-dot"></div>
        <div><div><b>${a.action}</b> — ${a.detail}</div>
        <div class="actlog-meta">${new Date(a.ts).toLocaleString('en-IN')}</div></div></div>`).join('') : '<div class="empty-state">No recorded events yet.</div>'}
      <div class="modal-actions"><button class="btn btn-primary" onclick="document.getElementById('modalRoot')?.remove()">Close</button></div>
    </div></div>`;

}
async function deleteUser(uid){
  const u = DB.users.find(x=>x.uid===uid);
  if((u.role==='admin'||u.role==='director') && DB.users.filter(x=>x.role==='admin'||x.role==='director').length<=1){ toast('Cannot remove the last Admin/Director', true); return; }
  DB.users = DB.users.filter(x=>x.uid!==uid);
  await save('users');
  await logActivity('USER_DELETED', `User "${u.name}" (${u.email}) removed by ${SESSION.name}`, {page:'User Management', recordId:u.email});
  toast('User removed'+(FB_MODE?' — note: their Firebase Auth login also needs removal in Firebase Console → Authentication':''));
  renderApp();
}

/* =========================================================
   SHARED PERMISSIONS EDITOR (departments & per-user overrides)
   ========================================================= */
function openPermsModal(kind, id){
  const target = kind==='dept' ? DB.departments.find(d=>d.id===id) : DB.users.find(u=>u.uid===id);
  const pp = target.pagePerms || {};
  const cp = target.colPerms || {};
  const legacyPages = Array.isArray(target.pages)? target.pages : null;
  const pageRows = PAGES.map(p=>{
    const acts = pp[p.id] || (legacyPages && legacyPages.includes(p.id) ? LEGACY_DEFAULT_ACTIONS : []);
    const actBoxes = PAGE_ACTIONS.map(a=>`<label><input type="checkbox" data-pg="${p.id}" data-act="${a}" ${acts.includes(a)?'checked':''}> ${ACTION_LABELS[a]}</label>`).join('');
    const colDef = COLS[p.id];
    const colSelects = colDef? `<div class="perm-cols" style="display:flex;">
      ${colDef.map(c=>{
        const st = (cp[p.id]&&cp[p.id][c.key]) || (target.cols&&Array.isArray(target.cols[p.id])? (target.cols[p.id].includes(c.key)?'view':'hidden') : 'view');
        return `<label style="gap:4px;">${c.label}
          <select data-cpg="${p.id}" data-col="${c.key}" style="padding:2px 4px;font-size:11px;border:1px solid var(--border);border-radius:4px;">
            <option value="hidden" ${st==='hidden'?'selected':''}>Hidden</option>
            <option value="view" ${st==='view'?'selected':''}>View Only</option>
            <option value="edit" ${st==='edit'?'selected':''}>Editable</option>
          </select></label>`;
      }).join('')}
    </div>` : '';
    return `<div class="perm-page-row">
      <div class="pg">${p.icon} ${p.label}
        <span style="margin-left:auto;font-size:10.5px;color:var(--muted);">tick allowed actions</span></div>
      <div class="perm-cols" style="display:flex;">${actBoxes}</div>
      ${colSelects?'<div style="font-size:10.5px;color:var(--muted);margin:6px 0 2px;padding-left:2px;">Column access:</div>'+colSelects:''}
    </div>`;
  }).join('');
  document.getElementById('modalRoot')?.remove();
  const div = document.createElement('div'); div.id='modalRoot';
  div.innerHTML = `<div class="modal-bg" onclick="if(event.target===this) this.remove()">
    <div class="modal" style="max-width:720px;">
      <h3>🔐 ${kind==='dept'?'Department':'Per-User Override'} Permissions — ${target.name}</h3>
      <div style="font-size:12px;color:var(--muted);margin-bottom:10px;">No View tick = the page disappears from this ${kind==='dept'?"department's":"user's"} menu and cannot be opened. ${kind==='user'?'Per-user settings override the department defaults.':''} Hidden columns vanish from tables AND exports.</div>
      ${pageRows}
      <div class="modal-actions">
        <button class="btn btn-ghost" onclick="document.getElementById('modalRoot')?.remove()">Cancel</button>
        <button class="btn btn-primary" onclick="savePerms('${kind}','${id}')">Save Permissions</button>
      </div>
    </div></div>`;
  document.body.appendChild(div);
}
async function savePerms(kind, id){
  const target = kind==='dept' ? DB.departments.find(d=>d.id===id) : DB.users.find(u=>u.uid===id);
  const pagePerms = {}, colPerms = {};
  PAGES.forEach(p=>{
    const acts = [...document.querySelectorAll(`input[data-pg="${p.id}"]`)].filter(b=>b.checked).map(b=>b.dataset.act);
    if(acts.length) pagePerms[p.id] = acts;
    const sels = [...document.querySelectorAll(`select[data-cpg="${p.id}"]`)];
    if(sels.length){
      const m = {};
      let restricted = false;
      sels.forEach(s=>{ m[s.dataset.col]=s.value; if(s.value!=='view') restricted=true; });
      if(restricted) colPerms[p.id] = m;
    }
  });
  target.pagePerms = pagePerms;
  target.colPerms = colPerms;
  if(kind==='dept'){ target.pages = Object.keys(pagePerms).filter(pid=>pagePerms[pid].includes('view')); delete target.cols; await save('departments'); }
  else await save('users');
  await logActivity('PERMISSION_CHANGE', `${kind==='dept'?'Department':'User'} "${target.name}" permissions updated — pages with View: [${Object.keys(pagePerms).filter(p=>pagePerms[p].includes('view')).join(', ')||'none'}]`, {page:kind==='dept'?'Department Management':'User Management', recordId:id});
  document.getElementById('modalRoot')?.remove();
  toast('Permissions saved — applies immediately (live) to affected users');
  renderApp();
}

function renderActivity(){
  if(!pageAllowed('activity')){ VIEW='dashboard'; return renderDashboard(); }
  const log = isAdmin() ? DB.activity : DB.activity.filter(a=>a.departmentId===SESSION.departmentId || a.departmentId===null);
  window.__actExport = log;
  const rows = log.length ? log.map(a=>`
    <div class="actlog-row"><div class="actlog-dot"></div>
      <div><div>${colAllowed('activity','action')?`<b>${a.action}</b>`:''}${colAllowed('activity','detail')?`${colAllowed('activity','action')?' — ':''}${a.detail}`:''}${(colAllowed('activity','page')&&a.page)?` <span class="tag">${a.page}</span>`:''}</div>
      <div class="actlog-meta">${[colAllowed('activity','user')?a.user:null, (colAllowed('activity','role')&&a.role)?'('+a.role+')':null, colAllowed('activity','ts')?new Date(a.ts).toLocaleString('en-IN'):null].filter(Boolean).join(' · ')}</div></div>
    </div>`).join('') : `<div class="empty-state"><div class="ic">🕒</div>No activity recorded yet.</div>`;
  const toolbar = (isAdmin()||can('export','activity'))? `<div class="toolbar"><button class="btn btn-ghost" onclick="exportActivityExcel()">⬇️ Export Activity Log (Excel)</button></div>`:'';
  renderShell(`${toolbar}<div class="card"><h2>🕒 Activity Log <span class="badge">${log.length} entries</span></h2>${rows}</div>`,
    '🕒 Activity Log', 'Who changed what, old → new values — included in every backup');
}

function exportRowsExcel(filename, rows, sheetName){
  if(typeof XLSX === 'undefined'){ toast('Excel engine not loaded — connect to the internet once and refresh.', true); return; }
  if(!rows || !rows.length){ toast('Nothing to export for the current view/filters', true); return; }
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows), sheetName||'Export');
  XLSX.writeFile(wb, filename);
  toast(rows.length.toLocaleString()+' row(s) exported');
}
function exportEmployeesExcel(){ exportRowsExcel('Employee_Master_'+new Date().toISOString().slice(0,10)+'.xlsx', window.__empExport||[], 'Employees'); }
function exportProjectsExcel(){ exportRowsExcel('Project_Master_'+new Date().toISOString().slice(0,10)+'.xlsx', window.__pjExport||[], 'Projects'); }
function exportRptProjectExcel(){ exportRowsExcel('Project_'+(window.__rcProj||'')+'_Cost_Report.xlsx', window.__rcExport||[], 'Cost Report'); }
function exportRptEmployeeExcel(){ exportRowsExcel('Employee_'+(window.__erEmp||'')+'_Project_Report.xlsx', window.__erExport||[], 'Employee Report'); }
function exportRptDesignationExcel(){ exportRowsExcel('Designation_'+(window.__drDes||'')+'_Project_Report.xlsx', window.__drExport||[], 'Designation Report'); }
function exportEntryExcel(){ exportRowsExcel('Daily_Entry_'+(window.__entryDate||'')+'.xlsx', window.__deExport||[], 'Daily Entry'); }
function exportDropdownExcel(){
  const names = Object.keys(DB.dropdowns).filter(n=>colAllowed('dropdown', n));
  const cols = [...names];
  if(colAllowed('dropdown','Managers')) cols.push('Managers');
  if(colAllowed('dropdown','ProjectID')) cols.push('ProjectID');
  const data = {}; names.forEach(n=>data[n]=DB.dropdowns[n]||[]);
  if(cols.includes('Managers')) data['Managers']=activeManagers().map(m=>m.name);
  if(cols.includes('ProjectID')) data['ProjectID']=openProjects().map(p=>String(p.code));
  const maxL = Math.max(0, ...cols.map(c=>data[c].length));
  const rows = [];
  for(let i=0;i<maxL;i++){ const o={}; cols.forEach(c=>o[c]=data[c][i]??''); rows.push(o); }
  exportRowsExcel('Dropdown_Lists.xlsx', rows, 'Dropdown');
}
function exportActivityExcel(){
  const rows = (window.__actExport||DB.activity).map(a=>{
    const o = {};
    if(colAllowed('activity','ts')) o['Date & Time'] = new Date(a.ts).toLocaleString('en-IN');
    if(colAllowed('activity','user')) o['User'] = a.user;
    if(colAllowed('activity','role')) o['Role'] = a.role;
    if(colAllowed('activity','action')) o['Action'] = a.action;
    if(colAllowed('activity','page')) o['Page'] = a.page||'';
    if(colAllowed('activity','detail')) o['Detail'] = a.detail;
    if(colAllowed('activity','changes')) o['Field Changes'] = (a.changes||[]).map(c=>`${c.field}: ${c.oldValue} → ${c.newValue}`).join('; ');
    return o;
  });
  exportRowsExcel('Activity_Log_'+new Date().toISOString().slice(0,10)+'.xlsx', rows, 'Activity Log');
}
function renderApp(){
  if(!SESSION){ renderLogin(); return; }
  switch(VIEW){
    case 'dashboard': return renderDashboard();
    case 'employees': return renderEmployees();
    case 'projects': return renderProjects();
    case 'timesheets': return renderTimesheets();
    case 'dailyentry': return renderEntry();
    case 'dropdown': return renderDropdown();
    case 'rpt_project': return renderRptProject();
    case 'rpt_employee': return renderRptEmployee();
    case 'rpt_designation': return renderRptDesignation();
    case 'rpt_summary': return renderRptSummary();
    case 'departments': return renderDepartments();
    case 'users': return renderUsers();
    case 'backup': return renderBackup();
    case 'activity': return renderActivity();
    default: return renderDashboard();
  }
}
(async function init(){
  document.getElementById('app').innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;color:#64757C;font-family:sans-serif;">Loading SHEPL dashboard…</div>';
  initFirebase();
  if(FB_MODE){
    /* With locked security rules, data is readable only AFTER sign-in. */
    renderLogin();
    firebase.auth().onAuthStateChanged(async (fbUser)=>{
      if(!fbUser){ if(!SESSION) renderLogin(); return; }
      if(SESSION) return;
      try{ await loadAll(); }catch(e){ console.error(e); }
      const email = String(fbUser.email||'').toLowerCase();
      let u = DB.users.find(x=>String(x.email||'').toLowerCase()===email);
      if(!u && DB.users.length===0){
        /* No profiles exist at all: the first successful sign-in becomes the Admin.
           Covers both First-Time Setup and recovery after an interrupted setup. */
        const nm = (window.__bootstrapIntent && window.__bootstrapIntent.email===email) ? window.__bootstrapIntent.name : email.split('@')[0];
        u = {uid:'U'+Date.now(), name:nm, email, role:'admin', departmentId:null,
          empId:null, scope:'all', status:'Active', mustChangePassword:false, createdAt:new Date().toISOString()};
        DB.users.push(u); await save('users');
        window.__bootstrapIntent = null;
      }
      if(!u){
        renderLogin('This login exists but has no dashboard profile. Ask your Admin to create your user record with this email.');
        try{ await firebase.auth().signOut(); }catch(e){}
        return;
      }
      startFirebaseListeners();
      setInterval(()=>{ runBackup().catch(()=>{}); }, 300000);
      await tsInit();
      await establishSession(u);
    });
  } else {
    try{ await loadAll(); }catch(e){ console.error(e); }
    await tsInit();
    renderApp();
    setInterval(()=>{ syncFromStore().catch(()=>{}); }, 5000);
    setInterval(()=>{ runBackup().catch(()=>{}); }, 300000);
  }
})();
