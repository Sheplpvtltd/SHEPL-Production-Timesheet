<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SHEPL Timesheet Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  :root{
    --teal:#17A385;         /* primary brand */
    --teal-dark:#0E7D66;
    --mint:#48CBA7;          /* logo accent */
    --mint-soft:#D6F2EB;     /* logo light tint */
    --ink:#26343C;           /* logo dark text */
    --bg:#F3F7F6;
    --card:#FFFFFF;
    --border:#DCE7E4;
    --muted:#64757C;
    --success:#1E7B34; --success-bg:#E8F5EA;
    --danger:#C62828;  --danger-bg:#FDECEC;
    --warn-bg:#FFF6E5; --warn-ink:#7A5A00;
    --radius:10px;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--sans);}
  button{font-family:var(--sans);cursor:pointer;}
  input,select{font-family:var(--sans);}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:#bcd2cc;border-radius:4px;}

  /* ---------- LOGIN ---------- */
  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:
    linear-gradient(160deg,#EAF7F3 0%,#F3F7F6 40%,#DFF2EC 100%);padding:24px;}
  .login-card{background:#fff;border-radius:16px;width:100%;max-width:470px;box-shadow:0 18px 50px rgba(23,163,133,.18);overflow:hidden;border:1px solid var(--border);}
  .login-head{padding:26px 28px 18px;text-align:center;border-bottom:4px solid var(--teal);}
  .login-head img{height:64px;}
  .login-title{font-size:20px;font-weight:800;margin:12px 0 2px;color:var(--ink);}
  .login-sub{color:var(--muted);font-size:13px;}
  .login-body{padding:24px 28px 28px;}
  .login-label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin-bottom:10px;}
  .account-list{display:flex;flex-direction:column;gap:8px;}
  .account-btn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:11px 14px;border:1px solid var(--border);border-radius:9px;background:#FAFDFC;transition:.15s;}
  .account-btn:hover{border-color:var(--teal);background:var(--mint-soft);}
  .avatar{width:34px;height:34px;border-radius:50%;background:var(--teal);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0;}
  .account-name{font-weight:700;font-size:14px;}
  .account-meta{font-size:12px;color:var(--muted);}
  .role-chip{margin-left:auto;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;padding:3px 9px;border-radius:20px;}
  .role-admin{background:var(--mint-soft);color:var(--teal-dark);}
  .role-user{background:#EEF2F1;color:var(--muted);}
  .login-footnote{margin-top:18px;font-size:11.5px;color:var(--muted);line-height:1.55;border-top:1px dashed var(--border);padding-top:13px;}

  /* ---------- SHELL ---------- */
  .shell{display:flex;min-height:100vh;}
  .sidebar{width:236px;background:#fff;border-right:1px solid var(--border);flex-shrink:0;display:flex;flex-direction:column;position:fixed;top:0;bottom:0;left:0;overflow-y:auto;z-index:20;}
  .sidebar-brand{padding:16px 16px 12px;border-bottom:1px solid var(--border);text-align:center;}
  .sidebar-brand img{height:52px;max-width:100%;}
  .nav{padding:12px 10px;display:flex;flex-direction:column;gap:2px;flex:1;}
  .nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;color:var(--ink);font-size:13px;font-weight:600;border:none;background:transparent;text-align:left;}
  .nav-item:hover{background:var(--mint-soft);}
  .nav-item.active{background:var(--teal);color:#fff;}
  .nav-icon{width:18px;text-align:center;font-size:14px;}
  .nav-divider{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);padding:12px 12px 4px;font-weight:800;}
  .sidebar-foot{padding:12px 14px 16px;border-top:1px solid var(--border);font-size:10.5px;color:var(--muted);line-height:1.5;}
  .backup-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--mint);margin-right:5px;}

  .main{flex:1;margin-left:236px;display:flex;flex-direction:column;min-width:0;}
  .topbar{background:linear-gradient(90deg,var(--teal) 0%,var(--mint) 130%);color:#fff;padding:14px 26px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10;box-shadow:0 2px 10px rgba(23,163,133,.25);}
  .topbar h1{font-size:17px;margin:0;font-weight:800;}
  .topbar .sub{font-size:12px;opacity:.9;margin-top:2px;}
  .who{display:flex;align-items:center;gap:12px;}
  .who .name{font-size:13px;font-weight:700;}
  .who .role{font-size:11px;opacity:.85;}
  .logout-btn{background:#ffffff22;border:1px solid #ffffff55;padding:7px 13px;border-radius:7px;font-size:12.5px;font-weight:700;color:#fff;}
  .logout-btn:hover{background:#ffffff33;}
  .content{padding:22px 26px 60px;flex:1;}

  /* ---------- COMPONENTS ---------- */
  .kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:14px;margin-bottom:20px;}
  .kpi{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:15px 17px;border-top:4px solid var(--teal);}
  .kpi .lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:800;}
  .kpi .val{font-size:23px;font-weight:800;margin-top:6px;font-family:var(--mono);color:var(--ink);}
  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;margin-bottom:18px;}
  .card h2{font-size:14.5px;margin:0 0 14px;font-weight:800;display:flex;align-items:center;gap:8px;color:var(--ink);}
  .card h2 .badge{font-size:10px;background:var(--mint-soft);color:var(--teal-dark);padding:2px 9px;border-radius:20px;font-weight:800;}
  table{width:100%;border-collapse:collapse;font-size:12.8px;}
  thead th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:#fff;background:var(--teal);padding:8px 10px;font-weight:700;white-space:nowrap;position:sticky;top:0;}
  tbody td{padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap;}
  tbody tr:nth-child(even){background:#F7FBFA;}
  tbody tr:hover{background:var(--mint-soft);}
  .table-scroll{overflow-x:auto;max-height:440px;overflow-y:auto;border:1px solid var(--border);border-radius:8px;}
  .empty-state{padding:32px 16px;text-align:center;color:var(--muted);font-size:13px;}
  .empty-state .ic{font-size:26px;margin-bottom:8px;}

  .btn{border:none;border-radius:7px;padding:9px 15px;font-size:12.8px;font-weight:800;display:inline-flex;align-items:center;gap:6px;}
  .btn-primary{background:var(--teal);color:#fff;}
  .btn-primary:hover{background:var(--teal-dark);}
  .btn-ghost{background:#fff;border:1px solid var(--border);color:var(--ink);}
  .btn-ghost:hover{background:var(--mint-soft);}
  .btn-danger{background:var(--danger-bg);color:var(--danger);}
  .btn-sm{padding:5px 10px;font-size:11.5px;border-radius:6px;}
  .btn[disabled]{opacity:.45;cursor:not-allowed;}

  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:16px;}
  .field{display:flex;flex-direction:column;gap:5px;}
  .field label{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:800;}
  .field input,.field select{padding:8px 10px;border:1px solid var(--border);border-radius:7px;font-size:13px;min-width:140px;background:#fff;color:var(--ink);}
  .field input:focus,.field select:focus{outline:2px solid var(--mint);outline-offset:0;border-color:var(--teal);}

  .badge-pill{font-size:10.5px;font-weight:800;padding:3px 9px;border-radius:20px;text-transform:uppercase;}
  .pill-open,.pill-active{background:var(--success-bg);color:var(--success);}
  .pill-closed,.pill-inactive{background:#EEF2F1;color:var(--muted);}

  .grid-code{font-family:var(--mono);font-size:12.3px;}
  .toast-wrap{position:fixed;top:20px;right:20px;z-index:999;display:flex;flex-direction:column;gap:8px;}
  .toast{background:var(--teal-dark);color:#fff;padding:12px 18px;border-radius:8px;font-size:13px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.22);animation:slidein .2s ease;max-width:380px;}
  .toast.err{background:var(--danger);}
  @keyframes slidein{from{transform:translateX(30px);opacity:0;}to{transform:translateX(0);opacity:1;}}

  .entry-grid-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:8px;}
  .entry-grid{width:100%;border-collapse:collapse;font-size:12.5px;min-width:980px;}
  .entry-grid th{background:var(--ink);color:#fff;padding:8px;font-size:10.5px;text-transform:uppercase;white-space:nowrap;position:sticky;top:0;}
  .entry-grid td{padding:5px 6px;border-bottom:1px solid var(--border);}
  .entry-grid td.static{font-weight:600;white-space:nowrap;}
  .entry-grid input,.entry-grid select{width:100%;padding:6px;border:1px solid var(--border);border-radius:5px;font-size:12.5px;}
  .entry-grid .hrs-input{width:56px;text-align:center;}
  .entry-grid .proj-select{min-width:105px;}
  .total-cell{font-family:var(--mono);font-weight:800;text-align:center;color:var(--teal-dark);}
  .pair-sep{border-left:2px solid var(--border);}

  .modal-bg{position:fixed;inset:0;background:#26343Caa;display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
  .modal{background:#fff;border-radius:12px;width:100%;max-width:520px;padding:22px;max-height:88vh;overflow-y:auto;}
  .modal h3{margin:0 0 14px;font-size:16px;font-weight:800;}
  .modal .field{margin-bottom:12px;width:100%;}
  .modal .field input,.modal .field select{width:100%;}
  .modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;}
  .err-list{background:var(--danger-bg);border:1px solid #f3c0c0;border-radius:8px;padding:12px 14px;font-size:12.5px;color:var(--danger);max-height:220px;overflow-y:auto;margin:10px 0;}
  .ok-note{background:var(--success-bg);border:1px solid #bfe3c6;border-radius:8px;padding:10px 14px;font-size:12.5px;color:var(--success);margin:10px 0;font-weight:700;}

  .actlog-row{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);font-size:12.5px;}
  .actlog-dot{width:8px;height:8px;border-radius:50%;background:var(--mint);margin-top:5px;flex-shrink:0;}
  .actlog-meta{color:var(--muted);font-size:11.5px;}

  .scope-banner{background:var(--mint-soft);border:1px solid #b6e4d7;color:var(--teal-dark);font-size:12.5px;font-weight:700;padding:9px 14px;border-radius:8px;margin-bottom:16px;}

  .dd-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;}
  .dd-col{border:1px solid var(--border);border-radius:8px;overflow:hidden;background:#fff;}
  .dd-col-head{background:var(--teal);color:#fff;padding:8px 12px;font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;display:flex;justify-content:space-between;align-items:center;}
  .dd-col-head .tag{font-size:9px;background:#ffffff33;padding:2px 6px;border-radius:10px;}
  .dd-items{padding:8px;display:flex;flex-direction:column;gap:5px;max-height:300px;overflow-y:auto;}
  .dd-item{display:flex;align-items:center;justify-content:space-between;padding:6px 9px;border:1px solid var(--border);border-radius:6px;font-size:12.5px;background:#FAFDFC;}
  .dd-item button{border:none;background:none;color:var(--danger);font-weight:800;font-size:13px;padding:0 3px;}
  .dd-add{display:flex;gap:5px;padding:8px;border-top:1px solid var(--border);}
  .dd-add input{flex:1;min-width:0;padding:6px 8px;border:1px solid var(--border);border-radius:6px;font-size:12px;}

  .perm-page-row{border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:8px;background:#FAFDFC;}
  .perm-page-row .pg{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;}
  .perm-cols{margin-top:8px;padding-left:26px;display:flex;flex-wrap:wrap;gap:6px 14px;}
  .perm-cols label{font-size:12px;display:flex;align-items:center;gap:5px;color:var(--muted);font-weight:600;}

  @media(max-width:860px){
    .sidebar{width:62px;}
    .sidebar-brand img{height:34px;}
    .nav-item span.lbl,.sidebar-foot,.nav-divider{display:none;}
    .nav-item{justify-content:center;}
    .main{margin-left:62px;}
    .kpi-row{grid-template-columns:repeat(2,1fr);}
    .content{padding:14px;}
  }
</style>
</head>

<div class="toast-wrap" id="toastWrap"></div>

const FIREBASE_CONFIG = {
  apiKey: "",
  authDomain: "",
  projectId: "",
  storageBucket: "",
  messagingSenderId: "",
  appId: ""
};

const SKEY = {
  employees:'ts2_employees', projects:'ts2_projects', users:'ts2_users',
  timesheets:'ts2_timesheets', activity:'ts2_activity',
  departments:'ts2_departments', dropdowns:'ts2_dropdowns', backupMeta:'ts2_backupmeta'
};
const BACKUP_KEY = 'ts2_backup_snapshot';

let DB = { employees:[], projects:[], users:[], timesheets:[], activity:[], departments:[], dropdowns:{}, backupMeta:{} };
let SESSION = null;
let VIEW = 'dashboard';

/* ---------- storage adapter (Firebase / Claude shared / localStorage / memory) ---------- */
const MEMSTORE = {};
let FB = null, FB_MODE = false;
const HAS_CLAUDE_STORAGE = (typeof window.storage !== 'undefined' && window.storage && typeof window.storage.get === 'function');
const HAS_LOCAL = (function(){ try{ localStorage.setItem('__t','1'); localStorage.removeItem('__t'); return true; }catch(e){ return false; } })();

function initFirebase(){
  try{
    if(typeof firebase === 'undefined' || !FIREBASE_CONFIG.projectId) return;
    firebase.initializeApp(FIREBASE_CONFIG);
    FB = firebase.firestore();
    FB_MODE = true;
    console.log('[SHEPL] Firebase mode active — real-time sync via Cloud Firestore');
  }catch(e){ console.error('Firebase init failed, falling back to local mode', e); FB_MODE=false; FB=null; }
}
async function storeGet(key){
  if(FB_MODE){ try{ const d = await FB.collection('dashboard').doc(key).get(); return d.exists ? d.data().v : null; }catch(e){ console.error(e); } }
  if(HAS_CLAUDE_STORAGE){ try{ const r = await window.storage.get(key, true); return r ? r.value : null; }catch(e){ return null; } }
  if(HAS_LOCAL){ return localStorage.getItem(key); }
  return MEMSTORE[key] ?? null;
}
async function storeSet(key, value){
  if(FB_MODE){ try{ await FB.collection('dashboard').doc(key).set({v: value, updatedAt: new Date().toISOString(), updatedBy: SESSION?SESSION.name:'system'}); return; }catch(e){ console.error(e); } }
  if(HAS_CLAUDE_STORAGE){ try{ await window.storage.set(key, value, true); return; }catch(e){} }
  if(HAS_LOCAL){ try{ localStorage.setItem(key, value); return; }catch(e){} }
  MEMSTORE[key] = value;
}

/* ---------- REAL-TIME SYNC ----------
   Firebase mode: live Firestore onSnapshot listeners (instant, all users).
   Local mode: cross-tab storage events + 5-second polling.
   Re-render is skipped while a modal is open or a field is focused,
   so nobody loses what they are typing. */
const KEY2NAME = Object.fromEntries(Object.entries(SKEY).map(([n,k])=>[k,n]));
function uiBusy(){
  if(document.getElementById('modalRoot')) return true;
  const a = document.activeElement;
  return !!(a && ['INPUT','SELECT','TEXTAREA'].includes(a.tagName));
}
function applyIncoming(name, raw){
  try{
    const cur = JSON.stringify(DB[name]);
    if(raw !== cur){ DB[name] = JSON.parse(raw); return true; }
  }catch(e){}
  return false;
}
function startFirebaseListeners(){
  FB.collection('dashboard').onSnapshot((snap)=>{
    let changed = false;
    snap.docChanges().forEach(ch=>{
      const name = KEY2NAME[ch.doc.id];
      if(name && ch.doc.data() && applyIncoming(name, ch.doc.data().v)) changed = true;
    });
    if(changed && SESSION && !uiBusy()) renderApp();
  }, (err)=>console.error('Firestore listener error', err));
}
async function syncFromStore(){
  if(FB_MODE || !SESSION || uiBusy()) return;
  let changed = false;
  for(const [name,key] of Object.entries(SKEY)){
    const v = await storeGet(key);
    if(v!=null && applyIncoming(name, v)) changed = true;
  }
  if(changed) renderApp();
}
window.addEventListener('storage', (e)=>{ if(e.key && String(e.key).startsWith('ts2_')) syncFromStore(); });

async function loadAll(){
  for(const k of Object.keys(SKEY)){
    try{
      const v = await storeGet(SKEY[k]);
      if(v){ DB[k] = JSON.parse(v); }
    }catch(e){ /* keep default */ }
  }
  // Auto-restore from backup if main store is empty but a backup exists
  if(DB.users.length===0){
    try{
      const b = await storeGet(BACKUP_KEY);
      if(b){ const snap = JSON.parse(b); if(snap.data && snap.data.users && snap.data.users.length){ DB = {...DB, ...snap.data}; toast('Data restored from last auto-backup'); } }
    }catch(e){}
  }
  if(DB.users.length===0) await seedStructural();
}
async function save(key){
  try{ await storeSet(SKEY[key], JSON.stringify(DB[key])); }catch(e){ console.error('save failed', key, e); }
}
async function saveAll(){ for(const k of Object.keys(SKEY)) await save(k); }

async function logActivity(action, detail, meta){
  DB.activity.unshift({
    id:'A'+Date.now()+Math.random().toString(36).slice(2,6),
    ts:new Date().toISOString(),
    user: SESSION ? SESSION.name : 'System',
    role: SESSION ? SESSION.role : '-',
    departmentId: SESSION ? SESSION.departmentId : null,
    action, detail,
    page: (meta&&meta.page)||null, changes: (meta&&meta.changes)||null
  });
  DB.activity = DB.activity.slice(0,1000);
  await save('activity');
}
function diffChanges(before, after, fields){
  if(!before) return null;
  const out = [];
  fields.forEach(f=>{
    const a = before[f]==null?'':String(before[f]);
    const b = after[f]==null?'':String(after[f]);
    if(a!==b) out.push({field:f, oldValue:a||'(blank)', newValue:b||'(blank)'});
  });
  return out.length? out : null;
}
function toast(msg, isErr){
  const wrap = document.getElementById('toastWrap');
  if(!wrap) return;
  const el = document.createElement('div');
  el.className = 'toast'+(isErr?' err':'');
  el.textContent = (isErr?'⚠️ ':'✅ ')+msg;
  wrap.appendChild(el);
  setTimeout(()=>el.remove(), 3600);
}

/* ---------- structural seed: NO sample data, only what the app needs to run ---------- */
async function seedStructural(){
  DB.employees = []; DB.projects = []; DB.timesheets = []; DB.activity = []; DB.departments = [];
  DB.users = [{uid:'admin', name:'Admin', role:'admin', departmentId:null}];
  // Dropdown lists exactly as per the attached Excel "Dropdown" sheet (structural config, not records)
  DB.dropdowns = {
    Designation: ['Supervisor','Fitter','Moulder','Welder','Helper','Turner','Skilled Helper','CNC Operator'],
    Flag: ['Active','Inactive'],
    Flag2: ['Yes','No'],
    Flag3: ['Open','Closed']
  };
  DB.backupMeta = {lastBackup:null};
  await saveAll();
}

/* ---------- helpers ---------- */
function projName(code){ const p=DB.projects.find(x=>String(x.code)===String(code)); return p?p.name:code; }
function managerName(mid){ const m=DB.employees.find(x=>x.empCode===mid); return m?m.name:(mid||'—'); }
function deptName(id){ const d=DB.departments.find(x=>x.id===id); return d?d.name:'—'; }
function fmtMoney(n){ return '₹'+ (Number(n)||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function fmtDate(d){ if(!d) return '—'; const dt=new Date(d); if(isNaN(dt)) return d; return dt.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'2-digit'}); }
function isAdmin(){ return SESSION && SESSION.role==='admin'; }
function myDept(){ return SESSION ? DB.departments.find(d=>d.id===SESSION.departmentId) : null; }
function activeManagers(){ return DB.employees.filter(e=>e.isManager && e.status==='Active'); }
function openProjects(){ return DB.projects.filter(p=>p.status==='Open'); }

function pageAllowed(pageId){
  if(isAdmin()) return true;
  const d = myDept();
  if(!d) return false;
  return (d.pages||[]).includes(pageId);
}
function colAllowed(pageId, colKey){
  if(isAdmin()) return true;
  const d = myDept();
  if(!d) return false;
  const cols = (d.cols||{})[pageId];
  if(!cols) return true; // no restriction set = all columns
  return cols.includes(colKey);
}
function visibleCols(pageId){ return COLS[pageId].filter(c=>colAllowed(pageId, c.key)); }

/* ---------- data scoping ---------- */
function scopedEmployees(){
  if(isAdmin()) return DB.employees;
  return DB.employees.filter(e=>e.departmentId===SESSION.departmentId);
}
function scopedTimesheets(){
  if(isAdmin()) return DB.timesheets;
  return DB.timesheets.filter(t=>t.departmentId===SESSION.departmentId);
}

  const u = DB.users.find(x=>x.uid===uid);
  if(!u){ toast('Account not found', true); return; }
  SESSION = u; VIEW='dashboard';
  try{ await logActivity('LOGIN', `${u.name} signed in`); }catch(e){}
  renderApp();
}
function logout(){ SESSION=null; renderApp(); }

function renderDashboard(){

  const now = new Date();
  const monthTs = ts.filter(t=>{ const d=new Date(t.date); return d.getMonth()===now.getMonth() && d.getFullYear()===now.getFullYear(); });
  const totalHrs = monthTs.reduce((s,t)=>s+Number(t.hours),0);
  const totalCost = monthTs.reduce((s,t)=>s+Number(t.hours)*Number(t.rate),0);
  const emps = scopedEmployees().filter(e=>e.status==='Active');
  const openP = openProjects().length;
  const recent = (isAdmin()? DB.activity : DB.activity.filter(a=>a.departmentId===SESSION.departmentId || a.departmentId===null)).slice(0,8);
  const actRows = recent.length ? recent.map(a=>`

      <div class="actlog-meta">${a.user} · ${new Date(a.ts).toLocaleString('en-IN')}</div></div>

  const html = `
    ${!isAdmin() ? `<div class="scope-banner">👁️ You're viewing <b>${deptName(SESSION.departmentId)}</b> data only, on pages permitted by Admin.</div>`:''}
    <div class="kpi-row">
      <div class="kpi"><div class="lbl">Hours this month</div><div class="val">${totalHrs.toFixed(1)}</div></div>
      <div class="kpi"><div class="lbl">Cost this month</div><div class="val">${fmtMoney(totalCost)}</div></div>

/* ---------- Download Bulk Upload Format ---------- */
function ddListText(listName){
  const vals = DB.dropdowns[listName]||[];
  return vals.length ? vals.join(', ') : '(list is empty — add values on the Dropdown page)';
}
function downloadTemplate(target){
  if(typeof XLSX === 'undefined'){ toast('Excel engine not loaded — connect to the internet once and refresh.', true); return; }
  const cfg = BULK_CFG[target];
  const wb = XLSX.utils.book_new();
  if(target==='dropdown'){
    const headers = Object.keys(DB.dropdowns);
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([headers]), cfg.sheet);
    const guide = [['Column','Mandatory','How to fill']].concat(headers.map(h=>[h,'No','One value per row under this column. The whole list is replaced by what you upload.']));
    guide.push(['Managers','—','Do NOT include — generated automatically from Employees marked Is Manager = Yes.']);
    guide.push(['ProjectID','—','Do NOT include — generated automatically from Open projects.']);
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(guide), 'Guide');
  } else {
    const headerRow = cfg.cols.map(c=>c[0] + (c[2]?' *':''));
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([headerRow]), cfg.sheet);
    const guide = [['Column','Mandatory','Format / Allowed values']];
    cfg.cols.forEach(c=>{
      let fmt = c[4]||'';
      if(String(c[3]).startsWith('dd:')) fmt = 'One of: '+ddListText(c[3].slice(3));
      if(c[3]==='yesno') fmt = 'Yes or No';
      if(c[3]==='dept') fmt = DB.departments.length? 'One of: '+DB.departments.map(d=>d.name).join(', ') : 'Create departments first (Departments & Access page)';
      guide.push([c[0], c[2]?'YES':'No', fmt]);
    });
    guide.push([]);
    guide.push(['Note','','Columns marked * are mandatory. Keep the column names and order unchanged. Fill your data below the header row of the '+cfg.sheet+' sheet, then use Bulk Upload on the '+cfg.sheet+' page.']);
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(guide), 'Guide');
  }
  XLSX.writeFile(wb, cfg.file);
  logActivity('DOWNLOAD', `Bulk upload format downloaded (${cfg.sheet})`, {page:cfg.sheet});
  toast('Format downloaded — fill it in Excel, then use Bulk Upload');
}

/* ---------- Upload + validation ---------- */
function openBulkUpload(target){
  if(typeof XLSX === 'undefined'){ toast('Excel engine not loaded — connect to the internet once and refresh this page.', true); return; }
  BULK_TARGET = target;
  const inp = document.getElementById('bulkFileInput');
  inp.value = ''; inp.onchange = handleBulkFile; inp.click();
}
function excelDateToISO(v){
  if(v==null || v==='') return null;
  if(v instanceof Date && !isNaN(v)) return v.toISOString().slice(0,10);
  if(typeof v === 'number'){ const d = new Date(Math.round((v - 25569) * 86400 * 1000)); return isNaN(d)?undefined:d.toISOString().slice(0,10); }
  const d = new Date(v); return isNaN(d)? undefined : d.toISOString().slice(0,10);
}
function parseNum(v){
  if(v==null || v==='') return null;
  const n = Number(String(v).replace(/[₹,\s]/g,''));
  return isNaN(n)? undefined : n;
}
function matchDD(listName, v){
  if(v==null || String(v).trim()==='') return null;
  const list = DB.dropdowns[listName]||[];
  const hit = list.find(x=>x.toLowerCase()===String(v).trim().toLowerCase());
  return hit===undefined? undefined : hit;
}
async function handleBulkFile(ev){
  const file = ev.target.files[0];
  if(!file) return;
  let wb;
  try{ wb = XLSX.read(await file.arrayBuffer(), {cellDates:true}); }
  catch(e){ toast('Could not read this file — please upload a valid Excel file.', true); return; }
  const ws = wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(ws, {defval:null});
  if(!rows.length){ toast('The uploaded sheet has no data rows below the header.', true); return; }
  if(BULK_TARGET==='dropdown'){ return bulkDropdown(rows); }

  const cfg = BULK_CFG[BULK_TARGET];
  const errors = [];   // {row, col, reason, fix}
  const warnings = [];

  /* 1) Header check — required columns must exist */
  const fileHeaders = Object.keys(rows[0]);
  const mappedFields = new Set(fileHeaders.map(h=>cfg.aliases[normalizeHeader(h)]).filter(Boolean));
  const missingCols = cfg.cols.filter(c=>c[2] && !mappedFields.has(c[1]));
  if(missingCols.length){
    return showBulkResult({created:0,updated:0,skipped:0,errors:[{row:1, col:missingCols.map(c=>c[0]).join(', '), reason:'Required column(s) missing from the file', fix:'Click "Download Bulk Upload Format" on this page and keep the column names unchanged'}], warnings:[]});
  }
  fileHeaders.forEach(h=>{ if(!cfg.aliases[normalizeHeader(h)]) warnings.push(`Column "${h}" is not recognised and was ignored.`); });

  /* 2) Row-by-row validation */
  const good = [];
  const seenKeys = {};
  rows.forEach((r, i)=>{
    const rowNo = i+2;
    const rec = {};
    for(const [h,v] of Object.entries(r)){
      const f = cfg.aliases[normalizeHeader(h)];
      if(f) rec[f] = v;
    }
    if(Object.values(rec).every(v=>v==null || String(v).trim()==='')) return; // skip fully empty rows
    let rowOK = true;
    const fail = (colLabel, reason, fix)=>{ errors.push({row:rowNo, col:colLabel, reason, fix}); rowOK=false; };

    for(const [label, field, required, type] of cfg.cols){
      let v = rec[field];
      const blank = (v==null || String(v).trim()==='');
      if(required && blank){ fail(label, 'Required field is empty', 'Fill this cell — it is mandatory'); continue; }
      if(blank){ rec[field]=null; continue; }
      if(type==='date'){
        const d = excelDateToISO(v);
        if(d===undefined){ fail(label, `"${v}" is not a valid date`, 'Enter a real date, e.g. 15-Mar-2024, or format the cell as Date in Excel'); }
        else rec[field]=d;
      } else if(type==='number'){
        const n = parseNum(v);
        if(n===undefined){ fail(label, `"${v}" is not a number`, 'Enter numbers only, e.g. 75.5 — no text'); }
        else rec[field]=n;
      } else if(String(type).startsWith('dd:')){
        const listName = type.slice(3);
        const m = matchDD(listName, v);
        if(m===undefined){ fail(label, `"${v}" is not in the ${listName} dropdown list`, `Use one of: ${ddListText(listName)} — or add it on the Dropdown page first`); }
        else rec[field]=m;
      } else if(type==='yesno'){
        if(!/^(yes|no|true|false|1|0)$/i.test(String(v).trim())){ fail(label, `"${v}" is not Yes/No`, 'Enter Yes or No'); }
        else rec[field] = /^(yes|true|1)$/i.test(String(v).trim());
      } else if(type==='dept'){
        const d = DB.departments.find(x=>x.name.toLowerCase()===String(v).trim().toLowerCase() || x.id===v);
        if(!d){ fail(label, `Department "${v}" does not exist`, 'Create it first on the Departments & Access page, or correct the spelling'); }
        else rec[field]=d.id;
      } else if(type==='emp'){
        const code = String(v).trim();
        if(!DB.employees.find(e=>e.empCode===code)){ fail(label, `Employee "${code}" is not on the Employees page`, 'Bulk-upload or add this employee first, then upload timesheets'); }
        else rec[field]=code;
      } else if(type==='proj'){
        const code = String(v).trim();
        if(!DB.projects.find(p=>String(p.code)===code)){ fail(label, `Project "${code}" is not on the Project List page`, 'Add this project first, then upload timesheets'); }
        else rec[field]=code;
      } else {
        rec[field]=String(v).trim();
      }
    }
    if(!rowOK) return;

    /* extra business checks */
    if(BULK_TARGET==='timesheets' && !(rec.hours>0)){ fail('Hrs','Hours must be greater than 0','Enter the hours actually worked, e.g. 8'); return; }
    if(BULK_TARGET==='timesheets' && rec.managerId && !DB.employees.find(e=>e.empCode===String(rec.managerId).trim())){
      fail('Manager ID of Entry', `Manager "${rec.managerId}" is not on the Employees page`, 'Use the EmpID of an existing employee, or leave blank'); return;
    }
    if(BULK_TARGET==='users' && rec.role && !/^(admin|user)$/i.test(String(rec.role).trim())){
      fail('Role', `"${rec.role}" is not a valid role`, 'Enter admin or user (blank = user)'); return;
    }
    if(BULK_TARGET==='users'){
      rec.role = /admin/i.test(String(rec.role||''))?'admin':'user';
      if(rec.role==='user' && !rec.departmentId){ fail('Department','Department is required for department users','Fill the Department column, or set Role to admin'); return; }
    }

    /* duplicates within the file */
    const dupKey = BULK_TARGET==='employees'? rec.empCode : BULK_TARGET==='projects'? String(rec.code) :
                   BULK_TARGET==='timesheets'? [rec.date,rec.empId,rec.projectId,rec.hours].join('|') :
                   (String(rec.name).toLowerCase()+'|'+(rec.departmentId||''));
    if(seenKeys[dupKey]){ fail(BULK_TARGET==='timesheets'?'(whole row)':'ID/Name', `Duplicate of row ${seenKeys[dupKey]} in this file`, 'Keep only one row per record'); return; }
    seenKeys[dupKey] = rowNo;

    good.push(rec);
  });

  /* 3) Import valid rows */
  let created=0, updated=0, skipped=0;
  if(BULK_TARGET==='employees'){
    good.forEach(rec=>{
      rec.status = rec.status || 'Active';
      if(rec.isManager==null) rec.isManager=false;
      const idx = DB.employees.findIndex(e=>e.empCode===rec.empCode);
      if(idx>=0){ DB.employees[idx] = {...DB.employees[idx], ...rec}; updated++; }
      else { DB.employees.push({managerId:null, departmentId:null, dol:null, ...rec}); created++; }
    });
    await save('employees');
  } else if(BULK_TARGET==='projects'){
    good.forEach(rec=>{
      rec.status = rec.status || 'Open';
      const idx = DB.projects.findIndex(p=>String(p.code)===String(rec.code));
      if(idx>=0){ DB.projects[idx] = {...DB.projects[idx], ...rec}; updated++; }
      else { DB.projects.push({desc:'', ...rec}); created++; }
    });
    await save('projects');
  } else if(BULK_TARGET==='timesheets'){
    good.forEach(rec=>{
      const exists = DB.timesheets.find(t=>t.date===rec.date && t.empId===rec.empId && String(t.projectId)===String(rec.projectId) && Number(t.hours)===Number(rec.hours));
      if(exists){ skipped++; return; }
      const emp = DB.employees.find(e=>e.empCode===rec.empId);
      DB.timesheets.push({
        id:'T'+Date.now()+Math.random().toString(36).slice(2,7),
        date: rec.date, empId: rec.empId,
        designation: rec.designation || (emp?emp.designation:''),
        rate: (rec.rate!=null) ? rec.rate : (emp?emp.rate:0),
        name: rec.name || (emp?emp.name:rec.empId),
        projectId: rec.projectId, hours: rec.hours,
        managerId: rec.managerId || null,
        departmentId: emp ? emp.departmentId : (isAdmin()? null : SESSION.departmentId),
        submittedBy: SESSION.name, submittedAt: new Date().toISOString(), batchId: 'BULK'+Date.now()
      });
      created++;
    });
    await save('timesheets');
  } else if(BULK_TARGET==='users'){
    good.forEach(rec=>{
      DB.users.push({uid:'U'+Date.now()+Math.random().toString(36).slice(2,5), name:String(rec.name).trim(), role:rec.role, departmentId: rec.role==='user'?rec.departmentId:null});
      created++;
    });
    await save('users');
  }
  await logActivity('BULK_UPLOAD', `${BULK_TARGET}: ${created} created, ${updated} updated, ${skipped} duplicate(s) skipped, ${errors.length} row(s) rejected`, {page:cfg.sheet});
  showBulkResult({created, updated, skipped, errors, warnings});
  renderApp();
}
async function bulkDropdown(rows){
  const lists = {};
  Object.keys(rows[0]).forEach(h=>{
    const clean = String(h).trim().replace(/\s*\*$/,'');
    if(/^(managers|projectid)$/i.test(clean.replace(/\s/g,''))) return;
    lists[clean] = [];
  });
  rows.forEach(r=>{
    for(const h of Object.keys(r)){
      const clean = String(h).trim().replace(/\s*\*$/,'');
      if(!(clean in lists)) continue;
      const v = r[h];
      if(v!=null && String(v).trim()!=='' && !lists[clean].includes(String(v).trim())) lists[clean].push(String(v).trim());
    }
  });
  let count = 0;
  for(const [k,vals] of Object.entries(lists)){
    if(vals.length){ DB.dropdowns[k] = vals; count++; }
  }
  await save('dropdowns');
  await logActivity('BULK_UPLOAD', `Dropdown lists replaced from Excel (${count} lists)`, {page:'Dropdown'});
  showBulkResult({created:count, updated:0, skipped:0, errors:[], warnings:[], noun:'list(s)'});
  renderApp();
}
function showBulkResult(res){
  document.getElementById('modalRoot')?.remove();
  const noun = res.noun || 'row(s)';
  const errTable = res.errors.length ? `
    <div style="font-size:12.5px;font-weight:800;color:var(--danger);margin-top:10px;">${res.errors.length} ${noun} rejected — nothing wrong was imported silently:</div>
    <div class="table-scroll" style="max-height:240px;margin:8px 0;">
      <table style="font-size:12px;">
        <thead><tr><th>Row</th><th>Column</th><th>Error</th><th>Required correction</th></tr></thead>
        <tbody>${res.errors.map(e=>`<tr><td>${e.row}</td><td>${e.col}</td><td style="white-space:normal;">${e.reason}</td><td style="white-space:normal;">${e.fix}</td></tr>`).join('')}</tbody>
      </table>
    </div>` : '';
  const warnHtml = res.warnings && res.warnings.length ? `<div style="font-size:12px;color:var(--warn-ink);background:var(--warn-bg);border-radius:8px;padding:8px 12px;margin-top:8px;">${res.warnings.join('<br>')}</div>` : '';
  const div = document.createElement('div'); div.id='modalRoot';
  div.innerHTML = `<div class="modal-bg" onclick="if(event.target===this) this.remove()">
    <div class="modal" style="max-width:640px;">
      <h3>📥 Bulk Upload Result</h3>
      <div class="ok-note">✅ ${res.created} ${noun} created${res.updated?`, ${res.updated} updated`:''}${res.skipped?`, ${res.skipped} duplicate(s) skipped`:''}.</div>
      ${errTable}${warnHtml}

      <div class="modal-actions"><button class="btn btn-primary" onclick="document.getElementById('modalRoot').remove()">Done</button></div>
    </div></div>`;
  document.body.appendChild(div);
}

   ========================================================= */
async function runBackup(){
  const snap = { ts: new Date().toISOString(), data: {
    employees:DB.employees, projects:DB.projects, users:DB.users, timesheets:DB.timesheets,
    activity:DB.activity, departments:DB.departments, dropdowns:DB.dropdowns
  }};
  await storeSet(BACKUP_KEY, JSON.stringify(snap));
  DB.backupMeta = {lastBackup: snap.ts};
  await save('backupMeta');
  const lbl = document.getElementById('lastBackupLbl');
  if(lbl) lbl.textContent = new Date(snap.ts).toLocaleTimeString('en-IN');
}
function downloadExcelBackup(){
  if(typeof XLSX === 'undefined'){ toast('Excel engine not loaded — connect to the internet once and refresh.', true); return; }
  const wb = XLSX.utils.book_new();
  const empRows = DB.employees.map(e=>({'EmpID':e.empCode,'Name':e.name,'Date of Joining':e.doj,'Rate(INR)/hr':e.rate,
    'Designation':e.designation,'Date of Leaving':e.dol,'Active/Inactive':e.status,'Is Manager':e.isManager?'Yes':'No',
    'Manager':managerName(e.managerId),'Department':deptName(e.departmentId)}));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(empRows.length?empRows:[{}]), 'Employees');
  const projRows = DB.projects.map(p=>({'ProjectID':p.code,'Project Name':p.name,'Description':p.desc,'Start Date':p.start,'End Date':p.end,'Open/Closed':p.status}));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(projRows.length?projRows:[{}]), 'ProjectList');
  const tsRows = DB.timesheets.map(t=>({'TimeSheet Date':t.date,'EmpId':t.empId,'Designation':t.designation,'Rate Per hr':t.rate,
    'Name':t.name,'Proj ID':t.projectId,'Hrs':t.hours,'Cost':(t.hours*t.rate),'Manager ID of Entry':t.managerId,'Department':deptName(t.departmentId),'Submitted By':t.submittedBy,'Submitted At':t.submittedAt}));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(tsRows.length?tsRows:[{}]), 'TimeSheets');
  const maxLen = Math.max(...Object.values(DB.dropdowns).map(v=>v.length), 1);
  const ddRows = [];
  for(let i=0;i<maxLen;i++){
    const row = {};
    for(const [k,vals] of Object.entries(DB.dropdowns)) row[k] = vals[i]||null;
    row['Managers'] = activeManagers()[i] ? activeManagers()[i].name : null;
    row['ProjectID'] = openProjects()[i] ? openProjects()[i].code : null;
    ddRows.push(row);
  }
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(ddRows), 'Dropdown');
  const deptRows = DB.departments.map(d=>({'Department':d.name,'Pages Allowed':(d.pages||[]).join(', '),'Column Restrictions':JSON.stringify(d.cols||{})}));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(deptRows.length?deptRows:[{}]), 'Departments');
  const userRows = DB.users.map(u=>({'Name':u.name,'Role':u.role,'Department':deptName(u.departmentId)}));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(userRows), 'Users');
  const actRows = DB.activity.map(a=>({'Time':a.ts,'User':a.user,'Role':a.role,'Action':a.action,'Detail':a.detail}));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(actRows.length?actRows:[{}]), 'ActivityLog');
  const fname = 'SHEPL_Timesheet_Backup_'+new Date().toISOString().slice(0,19).replace(/[:T]/g,'-')+'.xlsx';
  XLSX.writeFile(wb, fname);
  logActivity('EXPORT', 'Full Excel backup downloaded');
  toast('Excel backup downloaded');
}
function renderBackup(){
  if(!isAdmin()){ VIEW='dashboard'; return renderDashboard(); }
  const last = DB.backupMeta.lastBackup ? new Date(DB.backupMeta.lastBackup).toLocaleString('en-IN') : 'Not yet — runs automatically';
  const counts = `${DB.employees.length} employees · ${DB.projects.length} projects · ${DB.timesheets.length} timesheet rows · ${DB.users.length} users · ${DB.departments.length} departments · ${DB.activity.length} activity entries`;
  const html = `
    <div class="kpi-row">
      <div class="kpi"><div class="lbl">Auto-backup interval</div><div class="val">30 s</div></div>
      <div class="kpi"><div class="lbl">Last backup</div><div class="val" style="font-size:15px;">${last}</div></div>
      <div class="kpi"><div class="lbl">Total records</div><div class="val">${DB.employees.length+DB.projects.length+DB.timesheets.length}</div></div>
    </div>
    <div class="card">
      <h2>💾 Full Excel Backup</h2>
      <p style="font-size:13px;color:var(--muted);margin:0 0 14px;">Downloads one Excel file with every page as a separate sheet: Employees, ProjectList, TimeSheets, Dropdown, Departments, Users, and the complete Activity Log.<br><b>Currently backing up:</b> ${counts}</p>
      <button class="btn btn-primary" onclick="downloadExcelBackup()">⬇️ Download Excel Backup Now</button>
      <button class="btn btn-ghost" onclick="runBackup().then(()=>{toast('Backup saved'); renderApp();})">🔄 Run Backup Now</button>
    </div>
    <div class="card">
      <h2>ℹ️ How data safety works</h2>
      <p style="font-size:13px;color:var(--muted);line-height:1.6;margin:0;">
      Every change is saved instantly the moment it happens. Separately, a full snapshot of all pages is taken every 30 seconds.
      If the app ever opens and finds its main data missing, it restores automatically from the last snapshot.
      Nothing is lost on refresh, sign-out, or closing the browser.</p>
    </div>`;
  renderShell(html, '💾 Backup & Export', 'Automatic 30-second backups and full Excel download');
}

async function saveEmp(existingCode){
  const empCode = existingCode || document.getElementById('f_empCode').value.trim();
  const name = document.getElementById('f_name').value.trim();
  if(!empCode || !name){ toast('Emp ID and Name are required', true); return; }
  const data = {
    empCode, name,
    doj: document.getElementById('f_doj').value || null,
    rate: Number(document.getElementById('f_rate').value)||0,
    designation: document.getElementById('f_designation').value,
    dol: document.getElementById('f_dol').value || null,
    status: document.getElementById('f_status').value,
    isManager: document.getElementById('f_isManager').value==='true',
    managerId: document.getElementById('f_managerId').value || null,
    departmentId: document.getElementById('f_departmentId').value || null
  };
  const idx = DB.employees.findIndex(x=>x.empCode===empCode);
  const before = idx>=0 ? {...DB.employees[idx]} : null;
  if(idx>=0) DB.employees[idx]={...DB.employees[idx],...data}; else DB.employees.push(data);
  await save('employees');
  const ch = diffChanges(before, data, ['name','doj','rate','designation','dol','status','isManager','managerId','departmentId']);
  await logActivity(existingCode?'UPDATE':'CREATE',
    `Employee ${empCode} (${name}) ${existingCode?'updated':'created'}` + (ch? ' — '+ch.map(c=>`${c.field}: "${c.oldValue}" → "${c.newValue}"`).join('; ') : ''),
    {page:'Employees', changes:ch});
  document.getElementById('modalRoot').remove();
  toast('Employee saved'); renderApp();
}
async function deleteEmp(empCode){
  DB.employees = DB.employees.filter(x=>x.empCode!==empCode);
  await save('employees');
  await logActivity('DELETE', `Employee ${empCode} deleted`);
  document.getElementById('modalRoot').remove();
  toast('Employee deleted'); renderApp();
}

function exportTsExcel(){

  const rows = window.__tsRowsForExport||[];
  if(!rows.length){ toast('Nothing to export', true); return; }
  const cols = visibleCols('timesheets');
  const data = rows.map(r=>{
    const o = {};
    cols.forEach(c=>{
      if(c.key==='projectName') o[c.label]=projName(r.projectId);
      else if(c.key==='cost') o[c.label]=Number((r.hours*r.rate).toFixed(2));
      else if(c.key==='managerId') o[c.label]=managerName(r.managerId);

  });

      <button class="btn btn-primary" onclick="submitEntry()">✅ Submit Timesheet</button>
      <button class="btn btn-ghost" onclick="clearEntry()">🗑️ Clear</button>
      ${bulkBtn('timesheets')}
    </div>
    <div class="card"><h2>📝 Daily Time Entry <span class="badge">${teamEmps.length} employees</span></h2>
      ${teamEmps.length===0? `<div class="empty-state"><div class="ic">🧑‍🏭</div>${mgrPool.length? 'No active employees report to this manager yet. Assign employees a "Reports To" manager on the Employees page.' : 'No managers exist yet. On the Employees page, add employees and mark at least one as "Is Manager = Yes".'}</div>` : `
      <div class="entry-grid-wrap">
        <table class="entry-grid">
          <thead><tr>
            <th>Emp ID</th><th>Designation</th><th>Name</th>
            <th>Proj 1</th><th>Hrs</th><th>Proj 2</th><th>Hrs</th><th>Proj 3</th><th>Hrs</th>
            <th>Proj 4</th><th>Hrs</th><th>Proj 5</th><th>Hrs</th><th>Proj 6</th><th>Hrs</th><th>Total Hrs</th>
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>`}
    </div>`;
  renderShell(html, '📝 Daily Entry', 'Enter hours per project — rates apply automatically in the background');
}
function updateDraft(empCode, key, val){
  entryDraft[empCode] = entryDraft[empCode]||{};
  entryDraft[empCode][key] = val;
}
function clearEntry(){ entryDraft = {}; toast('Entry grid cleared'); renderApp(); }
async function submitEntry(){
  if(!window.__entryMgr){ toast('Please select a manager', true); return; }
  if(!window.__entryDate){ toast('Please select a date', true); return; }
  const mgr = window.__entryMgr;
  const mgrEmp = DB.employees.find(e=>e.empCode===mgr);
  let newRows = []; let dupeError = null;
  for(const empCode of Object.keys(entryDraft)){
    const d = entryDraft[empCode];
    const pairs = [1,2,3,4,5,6].map(i=>({p:d['p'+i], h:Number(d['h'+i])||0})).filter(x=>x.p && x.h>0);
    const ids = pairs.map(x=>x.p);
    if(new Set(ids).size !== ids.length){ dupeError = empCode; break; }
    const emp = DB.employees.find(e=>e.empCode===empCode);
    pairs.forEach(pr=>{
      newRows.push({
        id:'T'+Date.now()+Math.random().toString(36).slice(2,7),
        date: window.__entryDate, empId: empCode, designation: emp.designation,
        rate: emp.rate, name: emp.name, projectId: pr.p, hours: pr.h,
        managerId: mgr,
        departmentId: emp.departmentId || (mgrEmp?mgrEmp.departmentId:null) || SESSION.departmentId || null,
        submittedBy: SESSION.name, submittedAt: new Date().toISOString(), batchId: 'B'+Date.now()
      });
    });
  }
  if(dupeError){ toast('Duplicate project selected twice for '+dupeError, true); return; }
  if(newRows.length===0){ toast('No timesheet data entered', true); return; }
  DB.timesheets = DB.timesheets.concat(newRows);
  await save('timesheets');
  await logActivity('SUBMIT_TIMESHEET', `${newRows.length} rows for ${fmtDate(window.__entryDate)} (${managerName(mgr)}'s team)`);
  entryDraft = {};
  toast(`Timesheet submitted — ${newRows.length} rows saved`);
  renderApp();
}

async function addDept(){
  const name = document.getElementById('newDeptName').value.trim();
  if(!name){ toast('Type a department name', true); return; }
  if(DB.departments.find(d=>d.name.toLowerCase()===name.toLowerCase())){ toast('Department already exists', true); return; }
  const id = 'D'+Date.now();
  DB.departments.push({id, name, pages: PAGES.map(p=>p.id), cols:{}}); // default: all pages, all columns
  await save('departments');
  await logActivity('CREATE', `Department "${name}" created`);
  toast('Department added — click Edit Access to set permissions');
  renderApp();
}
async function deleteDept(id){
  const d = DB.departments.find(x=>x.id===id);
  if(DB.users.some(u=>u.departmentId===id)){ toast('Reassign this department\'s users first', true); return; }
  DB.departments = DB.departments.filter(x=>x.id!==id);
  DB.employees.forEach(e=>{ if(e.departmentId===id) e.departmentId=null; });
  await save('departments'); await save('employees');
  await logActivity('DELETE', `Department "${d.name}" deleted`);
  toast('Department deleted'); renderApp();
}
function openDeptModal(id){
  const d = DB.departments.find(x=>x.id===id);
  const pageRows = PAGES.map(p=>{
    const checked = (d.pages||[]).includes(p.id);
    const colDef = COLS[p.id];
    const restricted = (d.cols||{})[p.id];
    const colChecks = colDef ? `<div class="perm-cols" id="cols_${p.id}" style="display:${checked?'flex':'none'}">
      ${colDef.map(c=>{
        const colOn = !restricted || restricted.includes(c.key);
        return `<label><input type="checkbox" data-page="${p.id}" data-col="${c.key}" ${colOn?'checked':''}> ${c.label}</label>`;
      }).join('')}
    </div>` : '';
    return `<div class="perm-page-row">
      <div class="pg"><input type="checkbox" id="pg_${p.id}" ${checked?'checked':''}
        onchange="const c=document.getElementById('cols_${p.id}'); if(c) c.style.display=this.checked?'flex':'none';">
        <span>${p.icon} ${p.label}</span>
        ${colDef?'<span style="font-size:10.5px;color:var(--muted);font-weight:600;margin-left:auto;">column access ⇩</span>':''}
      </div>
      ${colChecks}
    </div>`;
  }).join('');
  document.getElementById('modalRoot')?.remove();
  const div = document.createElement('div'); div.id='modalRoot';
  div.innerHTML = `<div class="modal-bg" onclick="if(event.target===this) this.remove()">
    <div class="modal" style="max-width:600px;">
      <h3>🏢 ${d.name} — Page & Column Access</h3>
      <div class="field"><label>Department name</label><input id="d_name" value="${d.name}"></div>
      <div style="font-size:12px;color:var(--muted);margin:4px 0 12px;">Tick the pages this department can open. For data pages, untick columns to hide them from this department. Unticked pages disappear completely from their sidebar.</div>
      ${pageRows}
      <div class="modal-actions">
        <button class="btn btn-ghost" onclick="document.getElementById('modalRoot').remove()">Cancel</button>
        <button class="btn btn-primary" onclick="saveDept('${d.id}')">Save Permissions</button>
      </div>
    </div></div>`;
  document.body.appendChild(div);
}
async function saveDept(id){
  const d = DB.departments.find(x=>x.id===id);
  d.name = document.getElementById('d_name').value.trim() || d.name;
  d.pages = PAGES.filter(p=>document.getElementById('pg_'+p.id).checked).map(p=>p.id);
  d.cols = {};
  for(const pid of Object.keys(COLS)){
    if(!d.pages.includes(pid)) continue;
    const boxes = [...document.querySelectorAll(`input[data-page="${pid}"]`)];
    const on = boxes.filter(b=>b.checked).map(b=>b.dataset.col);
    if(on.length < COLS[pid].length) d.cols[pid] = on; // only store when actually restricted
  }
  await save('departments');
  await logActivity('PERMISSION_CHANGE', `Permissions updated for department "${d.name}" — pages: [${d.pages.join(', ')}]${Object.keys(d.cols).length? ' | column restrictions on: '+Object.keys(d.cols).join(', '):''}`, {page:'Departments & Access'});
  document.getElementById('modalRoot').remove();
  toast('Permissions saved — applies immediately to all users of this department');
  renderApp();
}

/* =========================================================
   USERS (admin)
   ========================================================= */
function renderUsers(){
  if(!isAdmin()){ VIEW='dashboard'; return renderDashboard(); }
  const rows = DB.users.map(u=>`<tr>
    <td style="font-weight:700;">${u.name}</td>
    <td><span class="badge-pill ${u.role==='admin'?'pill-active':'pill-inactive'}">${u.role}</span></td>
    <td>${u.role==='admin'?'All departments':deptName(u.departmentId)}</td>
    <td>${u.uid!=='admin'?`<button class="btn btn-sm btn-ghost" onclick="openUserModal('${u.uid}')">Edit</button>
        <button class="btn btn-sm btn-danger" onclick="deleteUser('${u.uid}')">Remove</button>`:''}</td>
  </tr>`).join('');
  const deptOpts = DB.departments.map(d=>`<option value="${d.id}">${d.name}</option>`).join('');
  const html = `
    <div class="card"><h2>➕ Add User</h2>
      ${DB.departments.length===0? '<div class="scope-banner">💡 Create at least one Department first (Departments & Access page) so you can assign users to it.</div>':''}
      <div class="toolbar" style="margin-bottom:0;">
        <div class="field"><label>Name</label><input id="u_name" placeholder="Full name"></div>
        <div class="field"><label>Role</label><select id="u_role" onchange="document.getElementById('u_deptWrap').style.display=this.value==='user'?'flex':'none'">
          <option value="user">Department User</option><option value="admin">Admin</option></select></div>
        <div class="field" id="u_deptWrap"><label>Department</label><select id="u_dept">${deptOpts||'<option value="">— create a department first —</option>'}</select></div>
        <button class="btn btn-primary" onclick="addUser()">+ Create User</button>
        ${bulkBtn('users')}
      </div>
    </div>
    <div class="card"><h2>🔑 Users <span class="badge">${DB.users.length}</span></h2>
      <div class="table-scroll"><table>
        <thead><tr><th>Name</th><th>Role</th><th>Department</th><th></th></tr></thead>
        <tbody>${rows}</tbody></table></div>
    </div>`;
  renderShell(html, '🔑 Users', 'Create accounts and assign them to departments');
}
async function addUser(){
  const name = document.getElementById('u_name').value.trim();
  const role = document.getElementById('u_role').value;
  const dept = document.getElementById('u_dept') ? document.getElementById('u_dept').value : '';
  if(!name){ toast('Name is required', true); return; }
  if(role==='user' && !dept){ toast('Assign a department to this user', true); return; }
  DB.users.push({uid:'U'+Date.now(), name, role, departmentId: role==='user'?dept:null});
  await save('users');
  await logActivity('CREATE', `User "${name}" created (${role}${role==='user'?', '+deptName(dept):''})`);
  toast('User created'); renderApp();
}
function openUserModal(uid){
  const u = DB.users.find(x=>x.uid===uid);
  const deptOpts = DB.departments.map(d=>`<option value="${d.id}" ${u.departmentId===d.id?'selected':''}>${d.name}</option>`).join('');
  document.getElementById('modalRoot')?.remove();
  const div = document.createElement('div'); div.id='modalRoot';
  div.innerHTML = `<div class="modal-bg" onclick="if(event.target===this) this.remove()">
    <div class="modal">
      <h3>Edit User</h3>
      <div class="field"><label>Name</label><input id="eu_name" value="${u.name}"></div>
      <div class="field"><label>Role</label><select id="eu_role"><option value="user" ${u.role==='user'?'selected':''}>Department User</option><option value="admin" ${u.role==='admin'?'selected':''}>Admin</option></select></div>
      <div class="field"><label>Department</label><select id="eu_dept">${deptOpts||'<option value="">—</option>'}</select></div>
      <div class="modal-actions">
        <button class="btn btn-ghost" onclick="document.getElementById('modalRoot').remove()">Cancel</button>
        <button class="btn btn-primary" onclick="saveUser('${uid}')">Save</button>
      </div>
    </div></div>`;
  document.body.appendChild(div);
}
async function saveUser(uid){
  const u = DB.users.find(x=>x.uid===uid);
  u.name = document.getElementById('eu_name').value.trim() || u.name;
  u.role = document.getElementById('eu_role').value;
  u.departmentId = u.role==='user' ? (document.getElementById('eu_dept').value||null) : null;
  await save('users');
  await logActivity('UPDATE', `User "${u.name}" updated`);
  document.getElementById('modalRoot').remove();
  toast('User updated'); renderApp();
}
async function deleteUser(uid){
  const u = DB.users.find(x=>x.uid===uid);
  DB.users = DB.users.filter(x=>x.uid!==uid);
  await save('users');
  await logActivity('DELETE', `User "${u.name}" removed`);
  toast('User removed'); renderApp();
}

/* =========================================================
   ACTIVITY LOG
   ========================================================= */
function renderActivity(){
  const log = isAdmin() ? DB.activity : DB.activity.filter(a=>a.departmentId===SESSION.departmentId || a.departmentId===null);
  const rows = log.length ? log.map(a=>`
    <div class="actlog-row"><div class="actlog-dot"></div>
      <div><div><b>${a.action}</b> — ${a.detail}</div>
      <div class="actlog-meta">${a.user} (${a.role}) · ${new Date(a.ts).toLocaleString('en-IN')}</div></div>
    </div>`).join('') : `<div class="empty-state"><div class="ic">🕒</div>No activity recorded yet.</div>`;
  const toolbar = isAdmin()? `<div class="toolbar"><button class="btn btn-ghost" onclick="exportActivityExcel()">⬇️ Export Activity Log (Excel)</button></div>`:'';
  renderShell(`${toolbar}<div class="card"><h2>🕒 Activity Log <span class="badge">${log.length} entries</span></h2>${rows}</div>`,
    '🕒 Activity Log', 'Who changed what, old → new values — included in every backup');
}

function exportActivityExcel(){
  if(typeof XLSX === 'undefined'){ toast('Excel engine not loaded — connect to the internet once and refresh.', true); return; }
  const data = DB.activity.map(a=>({'Date & Time':new Date(a.ts).toLocaleString('en-IN'),'User':a.user,'Role':a.role,'Action':a.action,'Page':a.page||'','Detail':a.detail,
    'Field Changes':(a.changes||[]).map(c=>`${c.field}: ${c.oldValue} → ${c.newValue}`).join(' | ')}));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(data.length?data:[{}]), 'ActivityLog');
  XLSX.writeFile(wb, 'SHEPL_Activity_Log.xlsx');
  toast('Activity log exported');
}

/* =========================================================
   ROOT
   ========================================================= */
function renderApp(){
  if(!SESSION){ renderLogin(); return; }
  switch(VIEW){
    case 'dashboard': return renderDashboard();
    case 'employees': return renderEmployees();
    case 'projects': return renderProjects();
    case 'timesheets': return renderTimesheets();
    case 'dailyentry': return renderEntry();
    case 'dropdown': return renderDropdown();
    case 'rpt_project': return renderRptProject();
    case 'rpt_employee': return renderRptEmployee();
    case 'rpt_designation': return renderRptDesignation();
    case 'departments': return renderDepartments();
    case 'users': return renderUsers();
    case 'backup': return renderBackup();
    case 'activity': return renderActivity();
    default: return renderDashboard();
  }
}
(async function init(){
  document.getElementById('app').innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;color:#64757C;font-family:sans-serif;">Loading SHEPL dashboard…</div>';
  initFirebase();
  try{ await loadAll(); }catch(e){ console.error(e); }
  renderApp();
  if(FB_MODE){ startFirebaseListeners(); }          // instant real-time for every user
  else { setInterval(()=>{ syncFromStore().catch(()=>{}); }, 5000); } // local mode: cross-tab + polling
  setInterval(()=>{ runBackup().catch(()=>{}); }, 30000); // auto-backup every 30 seconds
})();
</script>
