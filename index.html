<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SHEPL Timesheet Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<style>
  :root{
    --teal:#17A385;         /* primary brand */
    --teal-dark:#0E7D66;
    --mint:#48CBA7;          /* logo accent */
    --mint-soft:#D6F2EB;     /* logo light tint */
    --ink:#26343C;           /* logo dark text */
    --bg:#F3F7F6;
    --card:#FFFFFF;
    --border:#DCE7E4;
    --muted:#64757C;
    --success:#1E7B34; --success-bg:#E8F5EA;
    --danger:#C62828;  --danger-bg:#FDECEC;
    --warn-bg:#FFF6E5; --warn-ink:#7A5A00;
    --radius:10px;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--sans);}
  button{font-family:var(--sans);cursor:pointer;}
  input,select{font-family:var(--sans);}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:#bcd2cc;border-radius:4px;}

  /* ---------- LOGIN ---------- */
  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:
    linear-gradient(160deg,#EAF7F3 0%,#F3F7F6 40%,#DFF2EC 100%);padding:24px;}
  .login-card{background:#fff;border-radius:16px;width:100%;max-width:470px;box-shadow:0 18px 50px rgba(23,163,133,.18);overflow:hidden;border:1px solid var(--border);}
  .login-head{padding:26px 28px 18px;text-align:center;border-bottom:4px solid var(--teal);}
  .login-head img{height:64px;}
  .login-title{font-size:20px;font-weight:800;margin:12px 0 2px;color:var(--ink);}
  .login-sub{color:var(--muted);font-size:13px;}
  .login-body{padding:24px 28px 28px;}
  .login-label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin-bottom:10px;}
  .account-list{display:flex;flex-direction:column;gap:8px;}
  .account-btn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:11px 14px;border:1px solid var(--border);border-radius:9px;background:#FAFDFC;transition:.15s;}
  .account-btn:hover{border-color:var(--teal);background:var(--mint-soft);}
  .avatar{width:34px;height:34px;border-radius:50%;background:var(--teal);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0;}
  .account-name{font-weight:700;font-size:14px;}
  .account-meta{font-size:12px;color:var(--muted);}
  .role-chip{margin-left:auto;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;padding:3px 9px;border-radius:20px;}
  .role-admin{background:var(--mint-soft);color:var(--teal-dark);}
  .role-user{background:#EEF2F1;color:var(--muted);}
  .login-footnote{margin-top:18px;font-size:11.5px;color:var(--muted);line-height:1.55;border-top:1px dashed var(--border);padding-top:13px;}

  /* ---------- SHELL ---------- */
  .shell{display:flex;min-height:100vh;}
  .sidebar{width:236px;background:#fff;border-right:1px solid var(--border);flex-shrink:0;display:flex;flex-direction:column;position:fixed;top:0;bottom:0;left:0;overflow-y:auto;z-index:20;}
  .sidebar-brand{padding:16px 16px 12px;border-bottom:1px solid var(--border);text-align:center;}
  .sidebar-brand img{height:52px;max-width:100%;}
  .nav{padding:12px 10px;display:flex;flex-direction:column;gap:2px;flex:1;}
  .nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;color:var(--ink);font-size:13px;font-weight:600;border:none;background:transparent;text-align:left;}
  .nav-item:hover{background:var(--mint-soft);}
  .nav-item.active{background:var(--teal);color:#fff;}
  .nav-icon{width:18px;text-align:center;font-size:14px;}
  .nav-divider{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);padding:12px 12px 4px;font-weight:800;}
  .sidebar-foot{padding:12px 14px 16px;border-top:1px solid var(--border);font-size:10.5px;color:var(--muted);line-height:1.5;}
  .backup-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--mint);margin-right:5px;}

  .main{flex:1;margin-left:236px;display:flex;flex-direction:column;min-width:0;}
  .topbar{background:linear-gradient(90deg,var(--teal) 0%,var(--mint) 130%);color:#fff;padding:14px 26px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10;box-shadow:0 2px 10px rgba(23,163,133,.25);}
  .topbar h1{font-size:17px;margin:0;font-weight:800;}
  .topbar .sub{font-size:12px;opacity:.9;margin-top:2px;}
  .who{display:flex;align-items:center;gap:12px;}
  .who .name{font-size:13px;font-weight:700;}
  .who .role{font-size:11px;opacity:.85;}
  .logout-btn{background:#ffffff22;border:1px solid #ffffff55;padding:7px 13px;border-radius:7px;font-size:12.5px;font-weight:700;color:#fff;}
  .logout-btn:hover{background:#ffffff33;}
  .content{padding:22px 26px 60px;flex:1;}

  /* ---------- COMPONENTS ---------- */
  .kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:14px;margin-bottom:20px;}
  .kpi{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:15px 17px;border-top:4px solid var(--teal);}
  .kpi .lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:800;}
  .kpi .val{font-size:23px;font-weight:800;margin-top:6px;font-family:var(--mono);color:var(--ink);}
  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;margin-bottom:18px;}
  .card h2{font-size:14.5px;margin:0 0 14px;font-weight:800;display:flex;align-items:center;gap:8px;color:var(--ink);}
  .card h2 .badge{font-size:10px;background:var(--mint-soft);color:var(--teal-dark);padding:2px 9px;border-radius:20px;font-weight:800;}
  table{width:100%;border-collapse:collapse;font-size:12.8px;}
  thead th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:#fff;background:var(--teal);padding:8px 10px;font-weight:700;white-space:nowrap;position:sticky;top:0;}
  tbody td{padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap;}
  tbody tr:nth-child(even){background:#F7FBFA;}
  tbody tr:hover{background:var(--mint-soft);}
  .table-scroll{overflow-x:auto;max-height:440px;overflow-y:auto;border:1px solid var(--border);border-radius:8px;}
  .empty-state{padding:32px 16px;text-align:center;color:var(--muted);font-size:13px;}
  .empty-state .ic{font-size:26px;margin-bottom:8px;}

  .btn{border:none;border-radius:7px;padding:9px 15px;font-size:12.8px;font-weight:800;display:inline-flex;align-items:center;gap:6px;}
  .btn-primary{background:var(--teal);color:#fff;}
  .btn-primary:hover{background:var(--teal-dark);}
  .btn-ghost{background:#fff;border:1px solid var(--border);color:var(--ink);}
  .btn-ghost:hover{background:var(--mint-soft);}
  .btn-danger{background:var(--danger-bg);color:var(--danger);}
  .btn-sm{padding:5px 10px;font-size:11.5px;border-radius:6px;}
  .btn[disabled]{opacity:.45;cursor:not-allowed;}

  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:16px;}
  .field{display:flex;flex-direction:column;gap:5px;}
  .field label{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:800;}
  .field input,.field select{padding:8px 10px;border:1px solid var(--border);border-radius:7px;font-size:13px;min-width:140px;background:#fff;color:var(--ink);}
  .field input:focus,.field select:focus{outline:2px solid var(--mint);outline-offset:0;border-color:var(--teal);}

  .badge-pill{font-size:10.5px;font-weight:800;padding:3px 9px;border-radius:20px;text-transform:uppercase;}
  .pill-open,.pill-active{background:var(--success-bg);color:var(--success);}
  .pill-closed,.pill-inactive{background:#EEF2F1;color:var(--muted);}

  .grid-code{font-family:var(--mono);font-size:12.3px;}
  .toast-wrap{position:fixed;top:20px;right:20px;z-index:999;display:flex;flex-direction:column;gap:8px;}
  .toast{background:var(--teal-dark);color:#fff;padding:12px 18px;border-radius:8px;font-size:13px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.22);animation:slidein .2s ease;max-width:380px;}
  .toast.err{background:var(--danger);}
  @keyframes slidein{from{transform:translateX(30px);opacity:0;}to{transform:translateX(0);opacity:1;}}

  .entry-grid-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:8px;}
  .entry-grid{width:100%;border-collapse:collapse;font-size:12.5px;min-width:980px;}
  .entry-grid th{background:var(--ink);color:#fff;padding:8px;font-size:10.5px;text-transform:uppercase;white-space:nowrap;position:sticky;top:0;}
  .entry-grid td{padding:5px 6px;border-bottom:1px solid var(--border);}
  .entry-grid td.static{font-weight:600;white-space:nowrap;}
  .entry-grid input,.entry-grid select{width:100%;padding:6px;border:1px solid var(--border);border-radius:5px;font-size:12.5px;}
  .entry-grid .hrs-input{width:56px;text-align:center;}
  .entry-grid .proj-select{min-width:105px;}
  .total-cell{font-family:var(--mono);font-weight:800;text-align:center;color:var(--teal-dark);}
  .pair-sep{border-left:2px solid var(--border);}

  .modal-bg{position:fixed;inset:0;background:#26343Caa;display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
  .modal{background:#fff;border-radius:12px;width:100%;max-width:520px;padding:22px;max-height:88vh;overflow-y:auto;}
  .modal h3{margin:0 0 14px;font-size:16px;font-weight:800;}
  .modal .field{margin-bottom:12px;width:100%;}
  .modal .field input,.modal .field select{width:100%;}
  .modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;}
  .err-list{background:var(--danger-bg);border:1px solid #f3c0c0;border-radius:8px;padding:12px 14px;font-size:12.5px;color:var(--danger);max-height:220px;overflow-y:auto;margin:10px 0;}
  .ok-note{background:var(--success-bg);border:1px solid #bfe3c6;border-radius:8px;padding:10px 14px;font-size:12.5px;color:var(--success);margin:10px 0;font-weight:700;}

  .actlog-row{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);font-size:12.5px;}
  .actlog-dot{width:8px;height:8px;border-radius:50%;background:var(--mint);margin-top:5px;flex-shrink:0;}
  .actlog-meta{color:var(--muted);font-size:11.5px;}

  .scope-banner{background:var(--mint-soft);border:1px solid #b6e4d7;color:var(--teal-dark);font-size:12.5px;font-weight:700;padding:9px 14px;border-radius:8px;margin-bottom:16px;}

  .dd-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;}
  .dd-col{border:1px solid var(--border);border-radius:8px;overflow:hidden;background:#fff;}
  .dd-col-head{background:var(--teal);color:#fff;padding:8px 12px;font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;display:flex;justify-content:space-between;align-items:center;}
  .dd-col-head .tag{font-size:9px;background:#ffffff33;padding:2px 6px;border-radius:10px;}
  .dd-items{padding:8px;display:flex;flex-direction:column;gap:5px;max-height:300px;overflow-y:auto;}
  .dd-item{display:flex;align-items:center;justify-content:space-between;padding:6px 9px;border:1px solid var(--border);border-radius:6px;font-size:12.5px;background:#FAFDFC;}
  .dd-item button{border:none;background:none;color:var(--danger);font-weight:800;font-size:13px;padding:0 3px;}
  .dd-add{display:flex;gap:5px;padding:8px;border-top:1px solid var(--border);}
  .dd-add input{flex:1;min-width:0;padding:6px 8px;border:1px solid var(--border);border-radius:6px;font-size:12px;}

  .perm-page-row{border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:8px;background:#FAFDFC;}
  .perm-page-row .pg{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;}
  .perm-cols{margin-top:8px;padding-left:26px;display:flex;flex-wrap:wrap;gap:6px 14px;}
  .perm-cols label{font-size:12px;display:flex;align-items:center;gap:5px;color:var(--muted);font-weight:600;}

  @media(max-width:860px){
    .sidebar{width:62px;}
    .sidebar-brand img{height:34px;}
    .nav-item span.lbl,.sidebar-foot,.nav-divider{display:none;}
    .nav-item{justify-content:center;}
    .main{margin-left:62px;}
    .kpi-row{grid-template-columns:repeat(2,1fr);}
    .content{padding:14px;}
  }
</style>
</head>
<body>
<div id="app"></div>
<div class="toast-wrap" id="toastWrap"></div>
<input type="file" id="bulkFileInput" accept=".xlsx,.xls,.xlsm,.csv" style="display:none">

/* Timesheets use MONTH-PAGE storage (ts3_ts_YYYY-MM_pN) — see TS module below.

const BACKUP_KEY = 'ts2_backup_snapshot';

let SESSION = null;

/* ---------- storage adapter (Firebase / Claude shared / localStorage / memory) ---------- */
const MEMSTORE = {};
let FB = null, FB_MODE = false;
const HAS_CLAUDE_STORAGE = (typeof window.storage !== 'undefined' && window.storage && typeof window.storage.get === 'function');
const HAS_LOCAL = (function(){ try{ localStorage.setItem('__t','1'); localStorage.removeItem('__t'); return true; }catch(e){ return false; } })();

function initFirebase(){
  try{
    if(typeof firebase === 'undefined' || !FIREBASE_CONFIG.projectId) return;
    firebase.initializeApp(FIREBASE_CONFIG);
    FB = firebase.firestore();
    FB_MODE = true;
    console.log('[SHEPL] Firebase mode active — real-time sync via Cloud Firestore');
  }catch(e){ console.error('Firebase init failed, falling back to local mode', e); FB_MODE=false; FB=null; }
}
async function storeGet(key){
  if(FB_MODE){ try{ const d = await FB.collection('dashboard').doc(key).get(); return d.exists ? d.data().v : null; }catch(e){ console.error(e); } }
  if(HAS_CLAUDE_STORAGE){ try{ const r = await window.storage.get(key, true); return r ? r.value : null; }catch(e){ return null; } }
  if(HAS_LOCAL){ return localStorage.getItem(key); }
  return MEMSTORE[key] ?? null;
}
async function storeSet(key, value){
  if(FB_MODE){
    try{
      await FB.collection('dashboard').doc(key).set({v: value, updatedAt: new Date().toISOString(), updatedBy: SESSION?SESSION.name:'system'});
      return true;
    }catch(e){
      console.error('CLOUD SAVE FAILED', key, e);
      const emsg = String(e.code||'')+' '+String(e.message||'');
      let why = 'Check your internet connection.';
      if(emsg.includes('exceeds')||emsg.includes('longer than')) why = 'The data is too large for one cloud page (1 MB limit).';
      else if(emsg.includes('resource-exhausted')) why = 'Firebase free daily limit reached — cloud saves resume after the daily reset (~12:30 PM IST). The screen keeps working; avoid big uploads until then.';
      else if(emsg.includes('permission')) why = 'Permission problem — sign out and sign in again.';
      toast('⚠️ CLOUD SAVE FAILED for '+key+' — this change is NOT saved! '+why, true);
      return false;
    }
  }
  if(HAS_CLAUDE_STORAGE){ try{ await window.storage.set(key, value, true); return true; }catch(e){} }
  if(HAS_LOCAL){ try{ localStorage.setItem(key, value); return true; }catch(e){
    toast('⚠️ SAVE FAILED for '+key+' — data too large for browser storage.', true); return false; } }
  MEMSTORE[key] = value;
  return true;
}

/* ---------- REAL-TIME SYNC ----------
   Firebase mode: live Firestore onSnapshot listeners (instant, all users).
   Local mode: cross-tab storage events + 5-second polling.
   Re-render is skipped while a modal is open or a field is focused,
   so nobody loses what they are typing. */
const KEY2NAME = Object.fromEntries(Object.entries(SKEY).map(([n,k])=>[k,n]));
function uiBusy(){
  if(document.getElementById('modalRoot')) return true;
  const a = document.activeElement;
  return !!(a && ['INPUT','SELECT','TEXTAREA'].includes(a.tagName));
}
function applyIncoming(name, raw){
  try{
    const cur = JSON.stringify(DB[name]);
    if(raw !== cur){ DB[name] = JSON.parse(raw); return true; }
  }catch(e){}
  return false;
}
function startFirebaseListeners(){
  /* Listen ONLY to the small documents (masters, settings, index) — never the big
     month pages, so live-sync can't clog the connection the page-loader uses. */
  const ids = Object.values(SKEY).concat([TS_MANIFEST_KEY]);
  FB.collection('dashboard')
    .where(firebase.firestore.FieldPath.documentId(), 'in', ids)
    .onSnapshot((snap)=>{
      let changed = false;
      snap.docChanges().forEach(ch=>{
        const id = ch.doc.id;
        const data = ch.doc.data();
        if(!data) return;
        if(id===TS_MANIFEST_KEY){
          try{ const m = JSON.parse(data.v); if(JSON.stringify(m)!==JSON.stringify(TS.manifest)){ TS.manifest=m; changed=true; } }catch(e){}
        } else {
          const name = KEY2NAME[id];
          if(name && applyIncoming(name, data.v)) changed = true;
        }
      });
      if(changed && SESSION && !uiBusy()) renderApp();
    }, (err)=>console.error('Firestore listener error', err));
}
async function syncFromStore(){
  if(FB_MODE || !SESSION || uiBusy()) return;
  let changed = false, tsChanged = false;
  for(const [name,key] of Object.entries(SKEY)){
    const v = await storeGet(key);
    if(v!=null && applyIncoming(name, v)) changed = true;
  }
  for(const id of Object.keys(TS.parts)){
    const v = await storeGet(id);
    if(v!=null && v!==JSON.stringify(TS.parts[id])){ try{ TS.parts[id]=JSON.parse(v); tsChanged=true; }catch(e){} }
  }
  const mv = await storeGet(TS_MANIFEST_KEY);
  if(mv!=null && TS.manifest && mv!==JSON.stringify(TS.manifest)){ try{ TS.manifest=JSON.parse(mv); changed=true; }catch(e){} }
  if(tsChanged){ rebuildTsView(); changed = true; }
  if(changed) renderApp();
}
window.addEventListener('storage', (e)=>{ if(e.key && (String(e.key).startsWith('ts2_')||String(e.key).startsWith('ts3_'))) syncFromStore(); });

/* =========================================================
   TS — month-page timesheet storage.
   Every month lives on its own cloud page (auto-split into
   parts of 2,000 rows to stay under Firestore's 1 MB limit).
   Pages/reports load only the months they need.
   ========================================================= */
const TS = { manifest:null, parts:{}, inflight:new Set() };
const TS_MANIFEST_KEY = 'ts3_ts_manifest';
const PART_LIMIT = 2000;
function monthOf(d){ return String(d).slice(0,7); }
function partId(m,i){ return 'ts3_ts_'+m+'_p'+i; }
async function tsLoadManifest(force){
  if(TS.manifest && !force) return;
  try{ const v = await storeGet(TS_MANIFEST_KEY); TS.manifest = v? JSON.parse(v) : {parts:{}, counts:{}}; }
  catch(e){ TS.manifest = {parts:{}, counts:{}}; }
  if(!TS.manifest.counts) TS.manifest.counts = {};
}
function tsMonths(){ return TS.manifest? Object.keys(TS.manifest.parts).sort() : []; }
function tsTotalCount(){ return TS.manifest? Object.values(TS.manifest.counts||{}).reduce((s,n)=>s+(n||0),0) : DB.timesheets.length; }
function tsMonthLoaded(m){
  const n = (TS.manifest && TS.manifest.parts[m])||0;
  for(let i=0;i<n;i++) if(!(partId(m,i) in TS.parts)) return false;
  return true;
}
function tsMonthsForRange(from,to){
  const all = tsMonths();
  if(!all.length) return [];
  if(!from && !to) return all;
  const f = from? monthOf(from) : all[0];
  const t = to? monthOf(to) : all[all.length-1];
  return all.filter(m=> m>=f && m<=t);
}
function tsRangeReady(from,to){
  if(!TS.manifest) return false;
  return tsMonthsForRange(from,to).every(tsMonthLoaded);
}
let TS_VIEW_VERSION = 0;
function rebuildTsView(){
  const rows = [];
  for(const arr of Object.values(TS.parts)) rows.push(...arr);
  DB.timesheets = rows;
  TS_VIEW_VERSION++;          /* invalidates the sort/filter caches below */
}
/* ---- big-data caches: sort once per data change, filter once per filter change ---- */
let TS_SORT_CACHE = {v:-1, rows:[]};
function tsSortedRows(){
  if(TS_SORT_CACHE.v !== TS_VIEW_VERSION){
    TS_SORT_CACHE = {v: TS_VIEW_VERSION,
      rows: DB.timesheets.slice().sort((a,b)=> String(b.date).localeCompare(String(a.date)))};
  }
  return TS_SORT_CACHE.rows;
}
let TS_SCOPE_CACHE = {key:'', set:null};
function tsScopeSet(){
  if(isAdmin()) return null; /* null = everything allowed */
  const key = TS_VIEW_VERSION + '|' + SESSION.uid + '|' + (SESSION.scope||'own') + '|' + (SESSION.departmentId||'');
  if(TS_SCOPE_CACHE.key !== key){
    TS_SCOPE_CACHE = {key, set: new Set(scopedEmployees().map(e=>e.empCode))};
  }
  return TS_SCOPE_CACHE.set;
}
let TS_FILTER_CACHE = {key:'', rows:[]};
function tsFilteredRows(f){
  const key = [TS_VIEW_VERSION, SESSION.uid, SESSION.scope||'', f.emp, f.proj, f.from, f.to].join('|');
  if(TS_FILTER_CACHE.key !== key){
    const scope = tsScopeSet();
    const useDeptScope = !isAdmin() && userScope()==='department';
    let rows = tsSortedRows().filter(r=>{
      if(useDeptScope){ if(r.departmentId!==SESSION.departmentId) return false; }
      else if(scope && !scope.has(r.empId)) return false;
      if(f.emp && r.empId!==f.emp) return false;
      if(f.proj && String(r.projectId)!==String(f.proj)) return false;
      if(f.from && r.date < f.from) return false;
      if(f.to && r.date > f.to) return false;
      return true;
    });
    TS_FILTER_CACHE = {key, rows};
  }
  return TS_FILTER_CACHE.rows;
}
const TS_FETCHES = {}; /* id -> promise, shared between overlapping loads */
TS.failed = new Set();
function withTimeout(p, ms){
  return Promise.race([p, new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')), ms))]);
}
async function fetchPart(id){
  const tmo = window.PART_TIMEOUT || 25000;
  for(let attempt=1; attempt<=2; attempt++){
    try{
      const v = await withTimeout(storeGet(id), tmo);
      TS.parts[id] = v ? JSON.parse(v) : [];
      TS.failed.delete(id);
      return true;
    }catch(e){ console.warn('cloud page fetch retry', id, e.message||e); }
  }
  TS.parts[id] = [];      /* show the rest instead of hanging forever */
  TS.failed.add(id);
  return false;
}
async function tsEnsureMonths(months){
  await tsLoadManifest();
  const ids = [];
  months.forEach(m=>{
    const n = TS.manifest.parts[m]||0;
    for(let i=0;i<n;i++){ const id = partId(m,i); if(!(id in TS.parts)) ids.push(id); }
  });
  const BATCH = 6;         /* small convoys instead of one 79-truck traffic jam */
  let failedNow = 0;
  for(let i=0;i<ids.length;i+=BATCH){
    const chunk = ids.slice(i,i+BATCH).map(id=>{
      if(!TS_FETCHES[id]) TS_FETCHES[id] = fetchPart(id).finally(()=>{ delete TS_FETCHES[id]; });
      return TS_FETCHES[id];
    });
    const res = await Promise.all(chunk);
    failedNow += res.filter(ok=>ok===false).length;
  }
  rebuildTsView();
  if(failedNow) toast('⚠️ '+failedNow+' cloud page(s) timed out — showing everything that arrived. Click "Retry missing pages" to fetch the rest.', true);
}
function retryFailedParts(){
  TS.failed.forEach(id=>{ delete TS.parts[id]; });
  TS.failed.clear();
  renderApp();
}
async function tsEnsureRange(from,to){
  await tsLoadManifest();
  await tsEnsureMonths(tsMonthsForRange(from,to));
}
function kickTsLoad(from,to){
  const rangeKey = String(from||'')+'|'+String(to||'');
  window.__tsKicks = window.__tsKicks || {};
  if(window.__tsKicks[rangeKey]) return;
  window.__tsKicks[rangeKey] = true;
  tsEnsureRange(from,to).then(()=>{
    delete window.__tsKicks[rangeKey];
    if(SESSION && !document.getElementById('modalRoot')) renderApp();
  }).catch(e=>{
    console.error(e);
    delete window.__tsKicks[rangeKey];
    toast('⚠️ Loading timesheet pages failed — check internet and try again', true);
  });
}
async function tsSaveManifestMerged(){
  /* Before saving the index, merge with what's in the cloud so a stale
     in-memory index can never erase months written by another tab. */
  try{
    const v = await storeGet(TS_MANIFEST_KEY);
    if(v){
      const cloud = JSON.parse(v);
      for(const [m,n] of Object.entries(cloud.parts||{})) TS.manifest.parts[m] = Math.max(TS.manifest.parts[m]||0, n);
      for(const [m,c] of Object.entries(cloud.counts||{})) if(!(m in TS.manifest.counts)) TS.manifest.counts[m] = c;
    }
  }catch(e){}
  return await storeSet(TS_MANIFEST_KEY, JSON.stringify(TS.manifest));
}
async function tsAppend(rows){
  if(!rows.length) return true;
  await tsLoadManifest();
  const byM = {};
  rows.forEach(r=>{ const m = monthOf(r.date); (byM[m]=byM[m]||[]).push(r); });
  const dirty = new Set(); let manifestDirty = false;
  for(const [m, rs] of Object.entries(byM)){
    let n = TS.manifest.parts[m]||0;
    if(n===0){ TS.manifest.parts[m]=1; n=1; TS.parts[partId(m,0)]=TS.parts[partId(m,0)]||[]; manifestDirty=true; }
    for(const r of rs){
      let last = partId(m, n-1);
      if(!(last in TS.parts)) TS.parts[last] = [];
      if(TS.parts[last].length >= PART_LIMIT){
        n = (TS.manifest.parts[m] = n+1);
        last = partId(m, n-1);
        TS.parts[last] = [];
        manifestDirty = true;
      }
      TS.parts[last].push(r);
      dirty.add(last);
    }
    TS.manifest.counts[m] = (TS.manifest.counts[m]||0) + rs.length;
    manifestDirty = true;
  }
  let ok = true, done = 0;
  for(const id of dirty){
    const r = await storeSet(id, JSON.stringify(TS.parts[id]));
    if(r===false) ok = false;
    done++;
    if(dirty.size>10 && done%10===0) toast('Saving… '+done+' / '+dirty.size+' cloud pages');
  }
  if(manifestDirty){ if(await tsSaveManifestMerged()===false) ok=false; }
  try{ await aggApply(rows, +1); }catch(e){ console.error('agg apply', e); }
  rebuildTsView();
  return ok;
}
async function tsRemoveWhere(month, pred){
  await tsLoadManifest();
  const n = TS.manifest.parts[month]||0;
  const removed = []; const dirty = [];
  for(let i=0;i<n;i++){
    const id = partId(month,i);
    const arr = TS.parts[id]||[];
    const keep = arr.filter(r=>{ if(pred(r)){ removed.push(r); return false; } return true; });
    if(keep.length!==arr.length){ TS.parts[id]=keep; dirty.push(id); }
  }
  for(const id of dirty) await storeSet(id, JSON.stringify(TS.parts[id]));
  if(removed.length){
    TS.manifest.counts[month] = Math.max(0,(TS.manifest.counts[month]||0) - removed.length);
    await storeSet(TS_MANIFEST_KEY, JSON.stringify(TS.manifest));
    try{ await aggApply(removed, -1); }catch(e){ console.error('agg apply', e); }
  } /* note: removal writes directly — merge would resurrect the removed count */
  rebuildTsView();
  return removed;
}
async function tsInit(){
  if(window.__tsInit) return;
  window.__tsInit = true;
  try{
    await tsLoadManifest();
    /* one-time migration from the old single-page store */
    const legacy = await storeGet('ts2_timesheets');
    if(legacy){
      const rows = JSON.parse(legacy);
      if(Array.isArray(rows) && rows.length){

        await tsEnsureMonths(ms);

        await storeSet('ts2_timesheets', JSON.stringify([]));
        toast('Moved '+rows.length+' timesheet row(s) to the new month-page storage');
      }
    }
  }catch(e){ console.error('tsInit', e); }
}

/* =========================================================
   AGG — per-month report summaries ("answer sheets").
   Reports read these tiny documents instead of raw rows, so
   any date range renders instantly at any archive size:
   the cloud holds the data, the browser receives the answer.
   ========================================================= */
const AGG = { docs:{} };
function aggId(m){ return 'ts3_agg_'+m; }
function blankAgg(){ return {t:[0,0], pe:{}, ep:{}, dp:{}}; }
function aggAddRow(a, r, sign){
  const h = sign*Number(r.hours||0);
  const c = sign*Number(r.hours||0)*Number(r.rate||0);
  const p = String(r.projectId), e = String(r.empId), d = r.designation||'—';
  a.t[0]=+(a.t[0]+h).toFixed(4); a.t[1]=+(a.t[1]+c).toFixed(2);
  const pe = a.pe[p] = a.pe[p]||{}; const x = pe[e] = pe[e]||[0,0];
  x[0]=+(x[0]+h).toFixed(4); x[1]=+(x[1]+c).toFixed(2);
  if(x[0]<0.0001 && Math.abs(x[1])<0.01) delete pe[e];
  if(!Object.keys(pe).length) delete a.pe[p];
  const ep = a.ep[e] = a.ep[e]||{}; ep[p]=+((ep[p]||0)+h).toFixed(4);
  if(ep[p]<0.0001) delete ep[p];
  if(!Object.keys(ep).length) delete a.ep[e];
  const dp = a.dp[d] = a.dp[d]||{}; dp[p]=+((dp[p]||0)+h).toFixed(4);
  if(dp[p]<0.0001) delete dp[p];
  if(!Object.keys(dp).length) delete a.dp[d];
}
async function aggEnsureMonths(months){
  const need = months.filter(m=>!(m in AGG.docs));
  if(!need.length) return;
  await Promise.all(need.map(async m=>{
    try{ const v = await storeGet(aggId(m)); AGG.docs[m] = v? JSON.parse(v) : null; }
    catch(e){ AGG.docs[m] = null; }
  }));
}
function aggReady(months){ return months.every(m=> m in AGG.docs); }
function kickAggLoad(months){
  if(window.__aggKick) return;
  window.__aggKick = true;
  aggEnsureMonths(months).then(()=>{ window.__aggKick=false; if(SESSION && !document.getElementById('modalRoot')) renderApp(); })
    .catch(e=>{ console.error(e); window.__aggKick=false; });
}
/* Day-exact range reporting: full interior months come from the summaries,
   the partial edge months are computed from their raw pages. */
function hybridMonths(from, to){
  const all = tsMonthsForRange(from||null, to||null);
  const partial = new Set();
  if(from) partial.add(monthOf(from));
  if(to) partial.add(monthOf(to));
  const part = [...partial].filter(m=>all.includes(m));
  const full = all.filter(m=>!partial.has(m));
  return {full, part};
}
function hybridReady(from, to){
  const {full, part} = hybridMonths(from, to);
  return aggReady(full) && part.every(tsMonthLoaded);
}
function kickTsMonths(ms){
  if(window.__tsMKick) return;
  window.__tsMKick = true;
  tsEnsureMonths(ms).then(()=>{ window.__tsMKick=false; if(SESSION && !document.getElementById('modalRoot')) renderApp(); })
    .catch(e=>{ console.error(e); window.__tsMKick=false; });
}
function kickHybrid(from, to){
  const {full, part} = hybridMonths(from, to);
  if(!aggReady(full)) kickAggLoad(full);
  if(part.length && !part.every(tsMonthLoaded)) kickTsMonths(part);
}
function partialMonthRows(m, from, to){
  const n = (TS.manifest && TS.manifest.parts[m])||0;
  const out = [];
  for(let i=0;i<n;i++) (TS.parts[partId(m,i)]||[]).forEach(r=>{
    if(from && r.date < from) return;
    if(to && r.date > to) return;
    out.push(r);
  });
  return out;
}
async function aggApply(rows, sign){
  if(!rows.length) return;
  const byM = {};
  rows.forEach(r=>{ const m = monthOf(r.date); (byM[m]=byM[m]||[]).push(r); });
  await aggEnsureMonths(Object.keys(byM));
  for(const [m, rs] of Object.entries(byM)){
    if(sign<0 && !AGG.docs[m]) continue;    /* summary was never built — nothing to subtract */
    const a = AGG.docs[m] || blankAgg();
    rs.forEach(r=>aggAddRow(a, r, sign));
    AGG.docs[m] = a;
    await storeSet(aggId(m), JSON.stringify(a));
  }
}
async function rebuildAggregates(){
  if(!isAdmin()){ toast('Admin only', true); return; }
  await tsLoadManifest(true);
  const months = tsMonths();
  if(!months.length){ toast('No timesheet months exist yet'); return; }
  toast('🧮 Building report summaries for '+months.length+' month(s) — one month at a time, do not close this tab…');
  let done = 0;
  for(const m of months){
    await tsEnsureMonths([m]);
    const a = blankAgg();
    const n = TS.manifest.parts[m]||0;
    for(let i=0;i<n;i++) (TS.parts[partId(m,i)]||[]).forEach(r=>aggAddRow(a, r, +1));
    AGG.docs[m] = a;
    await storeSet(aggId(m), JSON.stringify(a));
    for(let i=0;i<n;i++) delete TS.parts[partId(m,i)];   /* memory-safe: only one month held at a time */
    done++;
    if(done%5===0 || done===months.length) toast('🧮 Summaries: '+done+' / '+months.length+' months built…');
  }
  rebuildTsView();
  await logActivity('AGG_REBUILD', 'Report summaries rebuilt for '+months.length+' month(s)', {page:'Backup & Export'});
  toast('✅ Report summaries ready — reports now open instantly for any date range');
  renderApp();
}

async function loadAll(){

    try{
      const v = await storeGet(SKEY[k]);
      if(v){ DB[k] = JSON.parse(v); }
    }catch(e){ /* keep default */ }
  }

  if(DB.users.length===0 && (!DB.dropdowns || Object.keys(DB.dropdowns).length===0)){
    try{
      const b = await storeGet(BACKUP_KEY);
      if(b){ const snap = JSON.parse(b); if(snap.data && snap.data.users && snap.data.users.length){ DB = {...DB, ...snap.data}; toast('Data restored from last auto-backup'); } }
    }catch(e){}

  if(!DB.settings || !DB.settings.maxDailyHours) DB.settings = {maxDailyHours:24, sessionMinutes:30, ...(DB.settings||{})};
}

function diffChanges(before, after, fields){
  if(!before) return null;
  const out = [];
  fields.forEach(f=>{
    const a = before[f]==null?'':String(before[f]);
    const b = after[f]==null?'':String(after[f]);
    if(a!==b) out.push({field:f, oldValue:a||'(blank)', newValue:b||'(blank)'});
  });
  return out.length? out : null;
}
function toast(msg, isErr){
  const wrap = document.getElementById('toastWrap');
  if(!wrap) return;
  const el = document.createElement('div');
  el.className = 'toast'+(isErr?' err':'');
  el.textContent = (isErr?'⚠️ ':'✅ ')+msg;
  wrap.appendChild(el);
  setTimeout(()=>el.remove(), 3600);
}

/* Effective permission: user override → department → legacy dept.pages → deny. Admin = everything. */
function can(action, pageId){
  if(!SESSION) return false;
  if(isAdmin()) return true;
  const u = SESSION;
  if(u.pagePerms && u.pagePerms[pageId]) return u.pagePerms[pageId].includes(action);
  const d = myDept();
  if(!d) return false;
  if(d.pagePerms && d.pagePerms[pageId]) return d.pagePerms[pageId].includes(action);
  if(Array.isArray(d.pages) && d.pages.includes(pageId)) return LEGACY_DEFAULT_ACTIONS.includes(action);
  return false;
}
function pageAllowed(pageId){
  if(!SESSION) return false;
  if(isAdmin()) return true;
  return can('view', pageId);
}
/* Column state: 'hidden' | 'view' | 'edit'. User override → dept → legacy visible-array → view */
function colState(pageId, colKey){
  if(!SESSION) return 'hidden';
  if(isAdmin()) return 'edit';
  const u = SESSION;
  if(u.colPerms && u.colPerms[pageId] && u.colPerms[pageId][colKey]) return u.colPerms[pageId][colKey];
  const d = myDept();
  if(!d) return 'hidden';

/* =========================================================
   AUTH — real login. No public sign-up. Admin creates users.
   Local mode: SHA-256 hashed passwords in the data store.
   Firebase mode: Firebase Authentication (email/password).
   ========================================================= */
/* compact SHA-256 (public-domain style implementation) */
function sha256(ascii){
  function rr(v,a){return (v>>>a)|(v<<(32-a));}
  var mathPow=Math.pow,maxWord=mathPow(2,32),i,j,result='',words=[],asciiBitLength=ascii.length*8;
  var hash=sha256.h=sha256.h||[],k=sha256.k=sha256.k||[],primeCounter=k.length,isComposite={};
  for(var candidate=2;primeCounter<64;candidate++){
    if(!isComposite[candidate]){
      for(i=0;i<313;i+=candidate){isComposite[i]=candidate;}
      hash[primeCounter]=(mathPow(candidate,.5)*maxWord)|0;
      k[primeCounter++]=(mathPow(candidate,1/3)*maxWord)|0;
    }
  }
  ascii+='\x80';
  while(ascii.length%64-56)ascii+='\x00';
  for(i=0;i<ascii.length;i++){
    j=ascii.charCodeAt(i);
    if(j>>8)return '';
    words[i>>2]|=j<<((3-i)%4)*8;
  }
  words[words.length]=(asciiBitLength/maxWord)|0;
  words[words.length]=asciiBitLength;
  for(j=0;j<words.length;){
    var w=words.slice(j,j+=16),oldHash=hash;
    hash=hash.slice(0,8);
    for(i=0;i<64;i++){
      var w15=w[i-15],w2=w[i-2];
      var a=hash[0],e=hash[4];
      var temp1=hash[7]+(rr(e,6)^rr(e,11)^rr(e,25))+((e&hash[5])^((~e)&hash[6]))+k[i]
        +(w[i]=(i<16)?w[i]:(w[i-16]+(rr(w15,7)^rr(w15,18)^(w15>>>3))+w[i-7]+(rr(w2,17)^rr(w2,19)^(w2>>>10)))|0);
      var temp2=(rr(a,2)^rr(a,13)^rr(a,22))+((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));
      hash=[(temp1+temp2)|0].concat(hash);
      hash[4]=(hash[4]+temp1)|0;
    }
    for(i=0;i<8;i++){hash[i]=(hash[i]+oldHash[i])|0;}
  }
  for(i=0;i<8;i++){
    for(j=3;j+1;j--){
      var b=(hash[i]>>(j*8))&255;
      result+=((b>>4).toString(16))+((b&15).toString(16));
    }
  }
  return result;
}
function hashPw(pw){ return sha256('shepl:'+pw); }

/* failed-login lockout: 5 fails => locked 5 minutes */
function loginLockInfo(email){
  try{
    const raw = HAS_LOCAL ? localStorage.getItem('fl_'+email) : MEMSTORE['fl_'+email];
    if(!raw) return {locked:false, n:0};
    const o = JSON.parse(raw);
    if(o.until && Date.now() < o.until) return {locked:true, until:o.until, n:o.n};
    return {locked:false, n: (Date.now()-o.ts < 15*60000) ? o.n : 0};
  }catch(e){ return {locked:false, n:0}; }
}
function noteFailedLogin(email){
  const info = loginLockInfo(email);
  const n = info.n + 1;
  const o = {n, ts:Date.now(), until: n>=5 ? Date.now()+5*60000 : 0};
  const raw = JSON.stringify(o);
  if(HAS_LOCAL) localStorage.setItem('fl_'+email, raw); else MEMSTORE['fl_'+email]=raw;
  return o;
}
function clearFailedLogins(email){ if(HAS_LOCAL) localStorage.removeItem('fl_'+email); else delete MEMSTORE['fl_'+email]; }

async function doLogin(){
  const email = document.getElementById('li_email').value.trim().toLowerCase();
  const pw = document.getElementById('li_pw').value;
  if(!email || !pw){ toast('Enter email and password', true); return; }
  const lock = loginLockInfo(email);
  if(lock.locked){ toast('Account temporarily locked after repeated failed attempts. Try again in a few minutes.', true); return; }
  if(FB_MODE){
    try{
      await firebase.auth().signInWithEmailAndPassword(email, pw);
      clearFailedLogins(email);
      // session continues in onAuthStateChanged
    }catch(e){
      const o = noteFailedLogin(email);
      try{ await logActivity('FAILED_LOGIN', `Failed sign-in attempt for ${email}${o.until?' — account locked 5 min':''}`, {page:'Login'}); }catch(_){}
      if(e.code==='auth/operation-not-allowed') toast('Email/Password sign-in is not enabled yet — Firebase Console → Authentication → Sign-in method → enable Email/Password', true);
      else toast('Sign-in failed: wrong email or password'+(o.until?' — locked for 5 minutes':''), true);
    }
    return;
  }
  await loadAll();
  const u = DB.users.find(x=>String(x.email||'').toLowerCase()===email);
  if(!u || u.pwHash !== hashPw(pw)){
    const o = noteFailedLogin(email);
    await logActivity('FAILED_LOGIN', `Failed sign-in attempt for ${email}${o.until?' — locked 5 min':''}`, {page:'Login'});
    toast('Sign-in failed: wrong email or password'+(o.until?' — locked for 5 minutes':''), true);
    return;
  }
  clearFailedLogins(email);
  await establishSession(u);
}

  if(typeof XLSX === 'undefined'){ toast('Excel engine not loaded — connect to the internet once and refresh.', true); return; }
  const cfg = BULK_CFG[target];
  const wb = XLSX.utils.book_new();
  if(target==='dropdown'){
    const headers = Object.keys(DB.dropdowns);
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([headers]), cfg.sheet);
    const guide = [['Column','Mandatory','How to fill']].concat(headers.map(h=>[h,'No','One value per row under this column. The whole list is replaced by what you upload.']));
    guide.push(['Managers','—','Do NOT include — generated automatically from Employees marked Is Manager = Yes.']);
    guide.push(['ProjectID','—','Do NOT include — generated automatically from Open projects.']);
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(guide), 'Guide');
  } else {
    const headerRow = cfg.cols.map(c=>c[0] + (c[2]?' *':''));
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([headerRow]), cfg.sheet);
    const guide = [['Column','Mandatory','Format / Allowed values']];
    cfg.cols.forEach(c=>{
      let fmt = c[4]||'';
      if(String(c[3]).startsWith('dd:')) fmt = 'One of: '+ddListText(c[3].slice(3));
      if(c[3]==='yesno') fmt = 'Yes or No';
      if(c[3]==='dept') fmt = DB.departments.length? 'One of: '+DB.departments.map(d=>d.name).join(', ') : 'Create departments first (Departments & Access page)';
      guide.push([c[0], c[2]?'YES':'No', fmt]);
    });
    guide.push([]);
    guide.push(['Note','','Columns marked * are mandatory. Keep the column names and order unchanged. Fill your data below the header row of the '+cfg.sheet+' sheet, then use Bulk Upload on the '+cfg.sheet+' page.']);
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(guide), 'Guide');
  }
  XLSX.writeFile(wb, cfg.file);
  logActivity('DOWNLOAD', `Bulk upload format downloaded (${cfg.sheet})`, {page:cfg.sheet});
  toast('Format downloaded — fill it in Excel, then use Bulk Upload');
}

/* ---------- Upload + validation ---------- */
function openBulkUpload(target){
  if(typeof XLSX === 'undefined'){ toast('Excel engine not loaded — connect to the internet once and refresh this page.', true); return; }
  BULK_TARGET = target;
  const inp = document.getElementById('bulkFileInput');
  inp.value = ''; inp.onchange = handleBulkFile; inp.click();
}
function excelDateToISO(v){
  if(v==null || v==='') return null;
  if(v instanceof Date && !isNaN(v)) return v.toISOString().slice(0,10);
  if(typeof v === 'number'){ const d = new Date(Math.round((v - 25569) * 86400 * 1000)); return isNaN(d)?undefined:d.toISOString().slice(0,10); }
  const d = new Date(v); return isNaN(d)? undefined : d.toISOString().slice(0,10);
}
function parseNum(v){
  if(v==null || v==='') return null;
  const n = Number(String(v).replace(/[₹,\s]/g,''));
  return isNaN(n)? undefined : n;
}
function matchDD(listName, v){
  if(v==null || String(v).trim()==='') return null;
  const list = DB.dropdowns[listName]||[];
  const hit = list.find(x=>x.toLowerCase()===String(v).trim().toLowerCase());
  return hit===undefined? undefined : hit;
}
async function handleBulkFile(ev){
  const file = ev.target.files[0];
  if(!file) return;
  let wb;
  try{ wb = XLSX.read(await file.arrayBuffer(), {cellDates:true}); }
  catch(e){ toast('Could not read this file — please upload a valid Excel file.', true); return; }
  const ws = wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(ws, {defval:null});
  if(!rows.length){ toast('The uploaded sheet has no data rows below the header.', true); return; }
  if(BULK_TARGET==='dropdown'){ return bulkDropdown(rows); }

  const cfg = BULK_CFG[BULK_TARGET];
  const errors = [];   // {row, col, reason, fix}
  const warnings = [];

  /* 1) Header check — required columns must exist */
  const fileHeaders = Object.keys(rows[0]);
  const mappedFields = new Set(fileHeaders.map(h=>cfg.aliases[normalizeHeader(h)]).filter(Boolean));
  const missingCols = cfg.cols.filter(c=>c[2] && !mappedFields.has(c[1]));
  if(missingCols.length){
    return showBulkResult({created:0,updated:0,skipped:0,errors:[{row:1, col:missingCols.map(c=>c[0]).join(', '), reason:'Required column(s) missing from the file', fix:'Click "Download Bulk Upload Format" on this page and keep the column names unchanged'}], warnings:[]});
  }
  fileHeaders.forEach(h=>{ if(!cfg.aliases[normalizeHeader(h)]) warnings.push(`Column "${h}" is not recognised and was ignored.`); });

  /* 2) Row-by-row validation */
  const good = [];
  const seenKeys = {};
  rows.forEach((r, i)=>{
    const rowNo = i+2;
    const rec = {};
    for(const [h,v] of Object.entries(r)){
      const f = cfg.aliases[normalizeHeader(h)];
      if(f) rec[f] = v;
    }
    if(Object.values(rec).every(v=>v==null || String(v).trim()==='')) return; // skip fully empty rows
    let rowOK = true;
    const fail = (colLabel, reason, fix)=>{ errors.push({row:rowNo, col:colLabel, reason, fix, raw:{...r}}); rowOK=false; };

    for(const [label, field, required, type] of cfg.cols){
      let v = rec[field];
      const blank = (v==null || String(v).trim()==='');
      if(required && blank){ fail(label, 'Required field is empty', 'Fill this cell — it is mandatory'); continue; }
      if(blank){ rec[field]=null; continue; }
      if(type==='date'){
        const d = excelDateToISO(v);
        if(d===undefined){ fail(label, `"${v}" is not a valid date`, 'Enter a real date, e.g. 15-Mar-2024, or format the cell as Date in Excel'); }
        else rec[field]=d;
      } else if(type==='number'){
        const n = parseNum(v);
        if(n===undefined){ fail(label, `"${v}" is not a number`, 'Enter numbers only, e.g. 75.5 — no text'); }
        else rec[field]=n;
      } else if(String(type).startsWith('dd:')){
        const listName = type.slice(3);
        const m = matchDD(listName, v);
        if(m===undefined){ fail(label, `"${v}" is not in the ${listName} dropdown list`, `Use one of: ${ddListText(listName)} — or add it on the Dropdown page first`); }
        else rec[field]=m;
      } else if(type==='yesno'){
        if(!/^(yes|no|true|false|1|0)$/i.test(String(v).trim())){ fail(label, `"${v}" is not Yes/No`, 'Enter Yes or No'); }
        else rec[field] = /^(yes|true|1)$/i.test(String(v).trim());
      } else if(type==='dept'){
        const d = DB.departments.find(x=>x.name.toLowerCase()===String(v).trim().toLowerCase() || x.id===v);
        if(!d){ fail(label, `Department "${v}" does not exist`, 'Create it first on the Departments & Access page, or correct the spelling'); }
        else rec[field]=d.id;
      } else if(type==='emp'){
        const code = String(v).trim();
        if(!DB.employees.find(e=>e.empCode===code)){ fail(label, `Employee "${code}" is not on the Employees page`, 'Bulk-upload or add this employee first, then upload timesheets'); }
        else rec[field]=code;
      } else if(type==='proj'){
        const code = String(v).trim();
        if(!DB.projects.find(p=>String(p.code)===code)){ fail(label, `Project "${code}" is not on the Project List page`, 'Add this project first, then upload timesheets'); }
        else rec[field]=code;
      } else {
        rec[field]=String(v).trim();
      }
    }
    if(!rowOK) return;

    /* extra business checks */
    if(BULK_TARGET==='timesheets' && !(rec.hours>0)){ fail('Hrs','Hours must be greater than 0','Enter the hours actually worked, e.g. 8'); return; }
    if(BULK_TARGET==='timesheets' && rec.managerId && !DB.employees.find(e=>e.empCode===String(rec.managerId).trim())){
      fail('Manager ID of Entry', `Manager "${rec.managerId}" is not on the Employees page`, 'Use the EmpID of an existing employee, or leave blank'); return;
    }
    if(BULK_TARGET==='users' && rec.role && !/^(admin|user|director)$/i.test(String(rec.role).trim())){
      fail('Role', `"${rec.role}" is not a valid role`, 'Enter admin, director, or user (blank = user)'); return;
    }
    if(BULK_TARGET==='users'){
      rec.role = /director/i.test(String(rec.role||''))?'director':(/admin/i.test(String(rec.role||''))?'admin':'user');
      if(rec.role==='user' && !rec.departmentId){ fail('Department','Department is required for department users','Fill the Department column, or set Role to admin'); return; }
    }

    /* duplicates within the file */
    const dupKey = BULK_TARGET==='employees'? rec.empCode : BULK_TARGET==='projects'? String(rec.code) :
                   BULK_TARGET==='timesheets'? [rec.date,rec.empId,rec.projectId,rec.hours].join('|') :
                   (String(rec.name).toLowerCase()+'|'+(rec.departmentId||''));
    if(seenKeys[dupKey]){ fail(BULK_TARGET==='timesheets'?'(whole row)':'ID/Name', `Duplicate of row ${seenKeys[dupKey]} in this file`, 'Keep only one row per record'); return; }
    seenKeys[dupKey] = rowNo;

    good.push(rec);
  });

  /* 3) Import valid rows */
  let created=0, updated=0, skipped=0;
  if(BULK_TARGET==='employees'){
    good.forEach(rec=>{
      rec.status = rec.status || 'Active';
      if(rec.isManager==null) rec.isManager=false;
      const idx = DB.employees.findIndex(e=>e.empCode===rec.empCode);
      if(idx>=0){ DB.employees[idx] = {...DB.employees[idx], ...rec}; updated++; }
      else { DB.employees.push({managerId:null, departmentId:null, dol:null, ...rec}); created++; }
    });
    await save('employees');
  } else if(BULK_TARGET==='projects'){
    good.forEach(rec=>{
      rec.status = rec.status || 'Open';
      const idx = DB.projects.findIndex(p=>String(p.code)===String(rec.code));
      if(idx>=0){ DB.projects[idx] = {...DB.projects[idx], ...rec}; updated++; }
      else { DB.projects.push({desc:'', ...rec}); created++; }
    });
    await save('projects');
  } else if(BULK_TARGET==='timesheets'){
    if(!FB_MODE && DB.timesheets.length + good.length > 4000){
      return showBulkResult({created:0,updated:0,skipped:0,warnings:[],errors:[{row:'-',col:'TimeSheets',
        reason:'Large history uploads need Firebase mode. Local (this-browser) storage can only hold a few thousand rows.',
        fix:'Open the dashboard in 🔥 Firebase mode (config filled in), then upload again.'}]});
    }
    const months = [...new Set(good.map(r=>monthOf(r.date)))];
    toast('Loading '+months.length+' month page(s) for duplicate checking…');
    await tsEnsureMonths(months);
    const seenSet = new Set(DB.timesheets.map(t=>[t.date,t.empId,t.projectId,t.hours].join('|')));
    const empMap = new Map(DB.employees.map(e=>[e.empCode,e]));
    const newRows = [];
    good.forEach(rec=>{
      const k = [rec.date,rec.empId,rec.projectId,rec.hours].join('|');
      if(seenSet.has(k)){ skipped++; return; }
      seenSet.add(k);
      const emp = empMap.get(rec.empId);
      newRows.push({
        id:'T'+Date.now()+Math.random().toString(36).slice(2,7),
        date: rec.date, empId: rec.empId,
        designation: rec.designation || (emp?emp.designation:''),
        rate: (rec.rate!=null) ? rec.rate : (emp?emp.rate:0),
        name: rec.name || (emp?emp.name:rec.empId),
        projectId: rec.projectId, hours: rec.hours,
        managerId: rec.managerId || null,
        departmentId: emp ? emp.departmentId : (isAdmin()? null : SESSION.departmentId),
        submittedBy: SESSION.name, submittedAt: new Date().toISOString(), batchId: 'BULK'+Date.now()
      });
      created++;
    });
    if(newRows.length){
      toast('Saving '+newRows.length.toLocaleString()+' rows to '+months.length+' month page(s) — please wait, do not close this tab…');
      const ok = await tsAppend(newRows);
      if(!ok) errors.push({row:'-', col:'TimeSheets', reason:'Some cloud pages failed to save (see the red messages that appeared).', fix:'Check your internet connection and upload the same file again — rows already saved will be skipped as duplicates.'});
    }
  } else if(BULK_TARGET==='users'){
    good.forEach(rec=>{
      DB.users.push({uid:'U'+Date.now()+Math.random().toString(36).slice(2,5), name:String(rec.name).trim(), role:rec.role, departmentId: rec.role==='user'?rec.departmentId:null});
      created++;
    });
    await save('users');
  }
  await logActivity('BULK_UPLOAD', `${BULK_TARGET}: ${created} created, ${updated} updated, ${skipped} duplicate(s) skipped, ${errors.length} row(s) rejected`, {page:cfg.sheet});
  showBulkResult({created, updated, skipped, errors, warnings});
  renderApp();
}
async function bulkDropdown(rows){
  const lists = {};
  Object.keys(rows[0]).forEach(h=>{
    const clean = String(h).trim().replace(/\s*\*$/,'');
    if(/^(managers|projectid)$/i.test(clean.replace(/\s/g,''))) return;
    lists[clean] = [];
  });
  rows.forEach(r=>{
    for(const h of Object.keys(r)){
      const clean = String(h).trim().replace(/\s*\*$/,'');
      if(!(clean in lists)) continue;
      const v = r[h];
      if(v!=null && String(v).trim()!=='' && !lists[clean].includes(String(v).trim())) lists[clean].push(String(v).trim());
    }
  });
  let count = 0;
  for(const [k,vals] of Object.entries(lists)){
    if(vals.length){ DB.dropdowns[k] = vals; count++; }
  }
  await save('dropdowns');
  await logActivity('BULK_UPLOAD', `Dropdown lists replaced from Excel (${count} lists)`, {page:'Dropdown'});
  showBulkResult({created:count, updated:0, skipped:0, errors:[], warnings:[], noun:'list(s)'});
  renderApp();
}
function downloadRejectedRows(){
  if(typeof XLSX==='undefined'){ toast('Excel engine not loaded — connect to the internet once and refresh.', true); return; }
  const errs = (window.__lastBulkErrors||[]).filter(e=>e.raw);
  if(!errs.length){ toast('No rejected rows to download', true); return; }
  const rows = errs.map(e=>({ 'Excel Row': e.row, ...e.raw, 'Rejected Column': e.col, 'Reject Reason': e.reason, 'How to Fix': e.fix }));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows), 'Rejected Rows');
  XLSX.writeFile(wb, 'Rejected_Rows_'+new Date().toISOString().slice(0,10)+'.xlsx');
  toast(errs.length+' rejected row(s) downloaded — fix the "Reject Reason" issues and bulk-upload the same file again (good rows are skipped as duplicates)');
}
function showBulkResult(res){
  window.__lastBulkErrors = res.errors||[];
  document.getElementById('modalRoot')?.remove();
  const noun = res.noun || 'row(s)';
  const errTable = res.errors.length ? `
    <div style="font-size:12.5px;font-weight:800;color:var(--danger);margin-top:10px;">${res.errors.length} ${noun} rejected — nothing wrong was imported silently:</div>
    <div class="table-scroll" style="max-height:240px;margin:8px 0;">
      <table style="font-size:12px;">
        <thead><tr><th>Row</th><th>Column</th><th>Error</th><th>Required correction</th></tr></thead>
        <tbody>${res.errors.map(e=>`<tr><td>${e.row}</td><td>${e.col}</td><td style="white-space:normal;">${e.reason}</td><td style="white-space:normal;">${e.fix}</td></tr>`).join('')}</tbody>
      </table>
    </div>` : '';
  const warnHtml = res.warnings && res.warnings.length ? `<div style="font-size:12px;color:var(--warn-ink);background:var(--warn-bg);border-radius:8px;padding:8px 12px;margin-top:8px;">${res.warnings.join('<br>')}</div>` : '';
  const div = document.createElement('div'); div.id='modalRoot';
  div.innerHTML = `<div class="modal-bg" onclick="if(event.target===this) this.remove()">
    <div class="modal" style="max-width:640px;">
      <h3>📥 Bulk Upload Result</h3>
      <div class="ok-note">✅ ${res.created} ${noun} created${res.updated?`, ${res.updated} updated`:''}${res.skipped?`, ${res.skipped} duplicate(s) skipped`:''}.</div>
      ${errTable}${warnHtml}
      ${res.errors.length?'<div style="font-size:12px;color:var(--muted);margin-top:6px;">Fix the listed rows in your Excel file and upload again — valid rows already imported will be updated, not duplicated.</div>':''}
      <div class="modal-actions">
        ${(res.errors&&res.errors.some(e=>e.raw))?'<button class="btn btn-ghost" onclick="downloadRejectedRows()">⬇ Download rejected rows (Excel)</button>':''}<button class="btn btn-primary" onclick="document.getElementById('modalRoot')?.remove()">Done</button></div>
    </div></div>`;
  document.body.appendChild(div);
}

async function runBackup(){
  /* Change-detection: if nothing changed since the last snapshot, write NOTHING
     (protects the Firebase free daily write quota). Timesheets live on their own
     durable month pages and are not duplicated into the snapshot. */
  const data = {
    employees:DB.employees, projects:DB.projects, users:DB.users,
    activity:DB.activity, departments:DB.departments, dropdowns:DB.dropdowns,
    drafts:DB.drafts, settings:DB.settings
  };
  const body = JSON.stringify(data);
  if(window.__lastBackupHash === body) return;
  const ts = new Date().toISOString();
  const ok = await storeSet(BACKUP_KEY, JSON.stringify({ts, data}));
  if(ok===false) return;
  window.__lastBackupHash = body;
  DB.backupMeta = {lastBackup: ts};
  await save('backupMeta');
  const lbl = document.getElementById('lastBackupLbl');
  if(lbl) lbl.textContent = new Date(ts).toLocaleTimeString('en-IN');
}

    ...Object.fromEntries((d.pairs||[]).flatMap((pr,i)=>[['Proj ID'+(i+1),pr.p||''],['Hrs'+(i+1),pr.h||'']]))}));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(draftRows.length?draftRows:[{}]), 'DailyEntry');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(userRows), 'Users');

      <p style="font-size:11.5px;color:var(--muted);margin:10px 0 0;">Deep Scan ignores the index completely: it opens the real cloud storage, finds every timesheet page that actually exists, counts the rows inside, and rebuilds the index from what it finds. Use it when the Doctor's report doesn't match what you uploaded. Rebuild Report Summaries recomputes the per-month "answer sheets" that make reports instant — run it once after any big upload, deep scan, or if a report shows a "summaries missing" warning.</p>
    </div>
    <div class="card">
      <h2>ℹ️ How data safety works</h2>
      <p style="font-size:13px;color:var(--muted);line-height:1.6;margin:0;">
      Every change is saved instantly the moment it happens. Separately, a full snapshot of all pages is taken every 5 minutes, and only when something actually changed.
      If the app ever opens and finds its main data missing, it restores automatically from the last snapshot.
      Nothing is lost on refresh, sign-out, or closing the browser.</p>
    </div>`;
  renderShell(html, '💾 Backup & Export', 'Automatic change-triggered backups and full Excel download');

async function runDataDoctor(){
  if(!isAdmin()){ toast('Admin only', true); return; }
  toast('🩺 Checking every cloud page — this reads the whole archive, please wait…');
  await tsLoadManifest(true);
  const months = Object.keys(TS.manifest.parts).sort();
  const rowsOut = [];
  let actualTotal = 0, expectedTotal = 0, missingDocs = 0;
  for(const m of months){
    const n = TS.manifest.parts[m]||0;
    let rows = 0; const miss = [];
    for(let i=0;i<n;i++){
      const v = await storeGet(partId(m,i));
      if(v==null){ miss.push('p'+i); missingDocs++; }
      else { try{ rows += JSON.parse(v).length; }catch(e){ miss.push('p'+i+'(corrupt)'); missingDocs++; } }
    }
    const exp = TS.manifest.counts[m]||0;
    actualTotal += rows; expectedTotal += exp;
    rowsOut.push(`<tr${rows!==exp||miss.length?' style="background:var(--danger-bg);"':''}><td>${m}</td><td>${n}</td><td>${rows.toLocaleString()}</td><td>${exp.toLocaleString()}</td><td>${miss.join(', ')||'—'}</td></tr>`);
  }
  const verdict = (missingDocs===0 && actualTotal===expectedTotal)
    ? `<div class="ok-note">✅ HEALTHY — all ${months.length} months present, ${actualTotal.toLocaleString()} rows really stored, counter matches exactly.</div>`
    : `<div class="err-list">⚠️ MISMATCH — counter claims ${expectedTotal.toLocaleString()} rows but the pages actually hold ${actualTotal.toLocaleString()}${missingDocs?`, with ${missingDocs} page(s) missing or unreadable`:''}. The fix: run the Bulk Upload of your full Excel again — rows already stored are skipped as duplicates, only the missing ones get written.</div>`;
  document.getElementById('modalRoot')?.remove();
  const div = document.createElement('div'); div.id='modalRoot';
  div.innerHTML = `<div class="modal-bg" onclick="if(event.target===this) this.remove()">
    <div class="modal" style="max-width:680px;">
      <h3>🩺 Data Doctor Report — v${APP_VERSION}</h3>
      ${verdict}
      <div class="table-scroll" style="max-height:300px;"><table style="font-size:12px;">
        <thead><tr><th>Month</th><th>Pages</th><th>Rows actually stored</th><th>Counter claims</th><th>Missing</th></tr></thead>
        <tbody>${rowsOut.join('')||'<tr><td colspan="5"><div class="empty-state">No month pages exist yet.</div></td></tr>'}</tbody>
      </table></div>
      <div class="modal-actions"><button class="btn btn-primary" onclick="document.getElementById('modalRoot')?.remove()">Close</button></div>
    </div></div>`;
  document.body.appendChild(div);
  await logActivity('DATA_DOCTOR', `Data Doctor: ${months.length} months, ${actualTotal.toLocaleString()} rows found vs ${expectedTotal.toLocaleString()} claimed, ${missingDocs} missing page(s)`, {page:'Backup & Export'});
}

async function listAllTsPartDocs(){
  const out = {};
  if(FB_MODE){
    const snap = await FB.collection('dashboard').get();
    snap.forEach(d=>{ if(/^ts3_ts_\d{4}-\d{2}_p\d+$/.test(d.id)){ out[d.id] = d.data().v; } });
  } else if(HAS_LOCAL){
    for(let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i);
      if(k && /^ts3_ts_\d{4}-\d{2}_p\d+$/.test(k)) out[k] = localStorage.getItem(k);
    }
  }
  return out;
}
async function deepScanRepair(){
  if(!isAdmin()){ toast('Admin only', true); return; }
  toast('🔎 Deep scanning the real cloud storage — please wait…');
  let docs;
  try{ docs = await listAllTsPartDocs(); }
  catch(e){ toast('Deep scan failed: '+(e.message||e), true); return; }
  const parts = {}, counts = {};
  for(const [id, v] of Object.entries(docs)){
    const m = id.match(/^ts3_ts_(\d{4}-\d{2})_p(\d+)$/);
    if(!m) continue;
    const month = m[1], idx = Number(m[2]);
    let rows = [];
    try{ rows = JSON.parse(v)||[]; }catch(e){}
    parts[month] = Math.max(parts[month]||0, idx+1);
    counts[month] = (counts[month]||0) + rows.length;
  }
  TS.manifest = {parts, counts};
  const ok = await storeSet(TS_MANIFEST_KEY, JSON.stringify(TS.manifest));
  TS.parts = {}; rebuildTsView();
  const months = Object.keys(parts).sort();
  const total = Object.values(counts).reduce((s,n)=>s+n,0);
  document.getElementById('modalRoot')?.remove();
  const div = document.createElement('div'); div.id='modalRoot';
  div.innerHTML = `<div class="modal-bg" onclick="if(event.target===this) this.remove()">
    <div class="modal" style="max-width:620px;">
      <h3>🔧 Deep Scan Result — v${APP_VERSION}</h3>
      <div class="${total>100? 'ok-note':'err-list'}">${total>100
        ? '🎉 FOUND THEM! '+total.toLocaleString()+' rows really exist in the cloud across '+months.length+' month page group(s). The index has been rebuilt'+(ok===false?' locally (cloud index save failed — check internet!)':' and saved')+'. Open the TimeSheets page with a wide date range to load and view everything.'
        : 'The cloud genuinely holds only '+total.toLocaleString()+' row(s) in '+months.length+' month(s) — the big upload\'s pages were never stored. The cure: run the Bulk Upload of your full Excel again on this version (v'+APP_VERSION+'). It is now protected against the index-overwrite bug, rows already stored are skipped, and any red save-failure message will appear loudly.'}</div>
      <div class="table-scroll" style="max-height:280px;"><table style="font-size:12px;">
        <thead><tr><th>Month</th><th>Pages found</th><th>Rows found</th></tr></thead>
        <tbody>${months.map(m=>`<tr><td>${m}</td><td>${parts[m]}</td><td>${counts[m].toLocaleString()}</td></tr>`).join('')||'<tr><td colspan="3"><div class="empty-state">No timesheet pages exist in the cloud.</div></td></tr>'}</tbody>
      </table></div>
      <div class="modal-actions"><button class="btn btn-primary" onclick="document.getElementById('modalRoot')?.remove(); renderApp();">Close</button></div>
    </div></div>`;
  document.body.appendChild(div);
  await logActivity('DEEP_SCAN', `Deep Scan: ${months.length} months, ${total.toLocaleString()} rows found in real storage; index rebuilt`, {page:'Backup & Export'});
}

async function deleteTimesheetRows(ids){
  const idSet = new Set(ids.map(String));
  const rows = DB.timesheets.filter(r=>idSet.has(String(r.id)));
  const byMonth = {};
  rows.forEach(r=>{ (byMonth[monthOf(r.date)] = byMonth[monthOf(r.date)]||new Set()).add(String(r.id)); });
  let removed = 0;
  for(const [m, set] of Object.entries(byMonth)){
    await tsEnsureMonths([m]);
    const out = await tsRemoveWhere(m, r=>set.has(String(r.id)));
    removed += out.length;
  }
  return removed;
}

  };
  const idx = DB.employees.findIndex(x=>x.empCode===empCode);
  const before = idx>=0 ? {...DB.employees[idx]} : null;
  if(idx>=0) DB.employees[idx]={...DB.employees[idx],...data}; else DB.employees.push(data);
  await save('employees');
  const ch = diffChanges(before, data, ['name','doj','rate','designation','dol','status','isManager','managerId','departmentId']);
  await logActivity(existingCode?'UPDATE':'CREATE',
    `Employee ${empCode} (${name}) ${existingCode?'updated':'created'}` + (ch? ' — '+ch.map(c=>`${c.field}: "${c.oldValue}" → "${c.newValue}"`).join('; ') : ''),
    {page:'Employees', changes:ch});
  document.getElementById('modalRoot')?.remove();
  toast('Employee saved'); renderApp();
}
async function deleteEmp(empCode){
  DB.employees = DB.employees.filter(x=>x.empCode!==empCode);
  await save('employees');
  await logActivity('DELETE', `Employee ${empCode} deleted`);
  document.getElementById('modalRoot')?.remove();
  toast('Employee deleted'); renderApp();
}

function renderTimesheets(){
  if(!pageAllowed('timesheets')){ VIEW='dashboard'; return renderDashboard(); }
  if(!window.__tsFilters){
    const today = new Date().toISOString().slice(0,10);
    window.__tsFilters = {emp:'',proj:'', from: today.slice(0,8)+'01', to: today};
  }
  const f = window.__tsFilters;
  if(!tsRangeReady(f.from, f.to)){
    kickTsLoad(f.from, f.to);
    return renderShell(loadingCard('⏳ Loading timesheet rows for the selected period…'+((!f.from&&!f.to)?'<br><span style="font-size:11.5px;color:var(--muted);">Entire history — with a large archive this can take a minute.</span>':'')), '🗂️ TimeSheets', 'Loading month pages…');
  }
  if(!window.__tsPend) window.__tsPend = {...f};
  const p = window.__tsPend;
  const rows = tsFilteredRows(f);   /* cached: computed once per filter change, reused on page flips */

  /* ---- pagination: the table draws one page at a time (the browser cannot
     survive 123,000 rows of DOM at once — that was the crash) ---- */

      <select style="padding:5px 8px;border:1px solid var(--border);border-radius:6px;font-size:12px;" onchange="window.__tsPageSize=Number(this.value); window.__tsPage=0; renderApp();">

      </select>
      <button class="btn btn-sm btn-ghost" ${window.__tsPage===0?'disabled':''} onclick="window.__tsPage=0; renderApp();">⏮ First</button>
      <button class="btn btn-sm btn-ghost" ${window.__tsPage===0?'disabled':''} onclick="window.__tsPage--; renderApp();">◀ Prev</button>

      <button class="btn btn-sm btn-ghost" ${window.__tsPage>=totalPages-1?'disabled':''} onclick="window.__tsPage++; renderApp();">Next ▶</button>
      <button class="btn btn-sm btn-ghost" ${window.__tsPage>=totalPages-1?'disabled':''} onclick="window.__tsPage=totalPages-1; renderApp();">Last ⏭</button>
    </div>` : '';
  const totalHrs = rows.reduce((s,r)=>s+Number(r.hours),0);
  const totalCost = rows.reduce((s,r)=>s+Number(r.hours)*Number(r.rate),0);
  const html = `
    <div class="toolbar">

      ${isAdmin()?`<button class="btn btn-danger" onclick="deleteAllFilteredTs()" title="Deletes every row matching the current filter">🗑 Delete ALL Filtered</button>`:''}

    <div class="kpi-row">
      <div class="kpi"><div class="lbl">Rows</div><div class="val">${rows.length.toLocaleString()}</div></div>
      <div class="kpi"><div class="lbl">Total Hours</div><div class="val">${totalHrs.toFixed(1)}</div></div>
      <div class="kpi"><div class="lbl">Total Cost</div><div class="val">${fmtMoney(totalCost)}</div></div>
    </div>
    <div class="card"><h2>🗂️ TimeSheets <span class="badge">${totalRows.toLocaleString()} rows</span></h2>
      <div class="table-scroll"><table>
        <thead><tr>${delOK?`<th><input type="checkbox" onchange="selectAllPage('timesheets',this.checked)"></th>`:''}${cols.map(c=>`<th>${c.label}</th>`).join('')}${delOK?'<th></th>':''}</tr></thead>
        <tbody>${body}</tbody>
      </table></div>
      ${pager}
    </div>`;
  renderShell(html, '🗂️ TimeSheets', 'Full transaction log with Rate per Hour');
  window.__tsRowsForExport = rows;
}
function applyTsSearch(){
  window.__tsFilters = {...window.__tsPend};
  window.__tsPage = 0;
  renderApp();
}
function exportTsExcel(){
  if(typeof XLSX === 'undefined'){ toast('Excel engine not loaded — connect to the internet once and refresh.', true); return; }
  const rows = window.__tsRowsForExport||[];
  if(!rows.length){ toast('Nothing to export', true); return; }
  if(rows.length>20000) toast('Building a large Excel ('+rows.length.toLocaleString()+' rows) — this can take up to a minute, please wait…');
  const cols = visibleCols('timesheets');
  const data = rows.map(r=>{
    const o = {};
    cols.forEach(c=>{ o[c.label] = (c.key==='managerId') ? (r.managerId||'') : r[c.key]; });
    return o;
  });
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(data), 'TimeSheets');
  XLSX.writeFile(wb, 'TimeSheets_Export.xlsx');
  toast('Excel exported');
}

/* =========================================================
   DAILY ENTRY — exact columns:
   Emp ID | Designation | Name of Employee | Proj ID1 | Hrs | ... | Proj ID6 | Hrs | Total hrs
   Draft → Submit workflow. Submitted entries explode into
   one Timesheet row per project with hours (sourceKey dedupe).
   ========================================================= */
let entryDraft = {}; // in-memory edits: key(empCode_date) -> {p1..p6,h1..h6}
function draftKey(empCode){ return empCode + '_' + window.__entryDate; }
function permittedProjects(){
  return DB.projects.filter(p=>{
    if(p.status!=='Open') return false;
    if(isAdmin()) return true;
    const allowed = p.allowedDepts||[];
    return allowed.length===0 || allowed.includes(SESSION.departmentId);
  });
}
function entryEmployees(){
  /* Everyone with Daily Entry access sees ALL entries, exactly like admin.
     What each user can DO (save draft / submit / delete / reopen) and which
     columns they see is controlled by the admin in Permissions. */
  let list = DB.employees.filter(e=>e.status==='Active');
  const q = (window.__deF||'').toLowerCase();
  if(q) list = list.filter(e=> String(e.empCode).toLowerCase().includes(q) || String(e.name||'').toLowerCase().includes(q) || String(e.designation||'').toLowerCase().includes(q));
  return list.slice().sort((a,b)=>String(a.empCode).localeCompare(String(b.empCode)));
}
function rowValues(emp){
  const key = draftKey(emp.empCode);
  const mem = entryDraft[key];
  if(mem) return mem;
  const d = DB.drafts[key];
  if(d && d.pairs){
    const o = {};
    d.pairs.forEach((pr,i)=>{ o['p'+(i+1)]=pr.p||''; o['h'+(i+1)]=pr.h||''; });
    return o;
  }
  return {};
}
function rowStatus(emp){
  const d = DB.drafts[draftKey(emp.empCode)];
  return d ? d.status : '—';
}
function renderEntry(){
  if(!pageAllowed('dailyentry')){ VIEW='dashboard'; return renderDashboard(); }
  if(!window.__entryDate) window.__entryDate = new Date().toISOString().slice(0,10);
  const emps = entryEmployees();
  const projs = permittedProjects();
  const projDL = `<datalist id="projDL">${projs.map(p=>`<option value="${p.code}">${p.name}</option>`).join('')}</datalist>`;
  const canDraft = can('save_draft','dailyentry') || can('add','dailyentry');
  const canSub = can('submit','dailyentry');
  const canDel = can('delete','dailyentry');
  const canReopen = isAdmin() || can('reopen','dailyentry');

  window.__deExport = emps.map(e=>{
    const v = rowValues(e); const o = {};
    if(colAllowed('dailyentry','empCode')) o['Emp ID']=e.empCode;
    if(colAllowed('dailyentry','designation')) o['Designation']=e.designation||'';
    if(colAllowed('dailyentry','name')) o['Name of Employee']=e.name;
    let tot=0;
    for(let i=1;i<=6;i++){ o['Proj ID'+i]=v['p'+i]||''; o['Hrs'+i]=v['h'+i]||''; if(v['p'+i]&&Number(v['h'+i])>0) tot+=Number(v['h'+i]); }
    if(colAllowed('dailyentry','total')) o['Total hrs']= tot||'';
    if(colAllowed('dailyentry','status')) o['Status']= (DB.drafts[draftKey(e.empCode)]||{}).status||'';
    return o;
  });
  const rows = emps.map(e=>{
    const key = draftKey(e.empCode);
    const v = rowValues(e);
    const status = rowStatus(e);
    const locked = (status==='Submitted') && !canReopen ? true : (status==='Submitted');
    let total = 0;
    const pairCells = [1,2,3,4,5,6].map(i=>{
      const pv = v['p'+i]||'', hv = v['h'+i]||'';
      if(pv && Number(hv)>0) total += Number(hv);
      return `<td class="${i%2===1?'pair-sep':''}">
        <input class="proj-select" list="projDL" value="${pv}" placeholder="Proj ID" ${locked?'disabled':''}
          onchange="updateDraft('${key}','p${i}',this.value)"></td>
      <td><input class="hrs-input" type="number" min="0" step="0.05" value="${hv}" ${locked?'disabled':''}
          onchange="updateDraft('${key}','h${i}',this.value)"></td>`;
    }).join('');
    const statusPill = status==='Submitted' ? '<span class="badge-pill pill-active">Submitted</span>'
      : status==='Draft' ? '<span class="badge-pill" style="background:var(--warn-bg);color:var(--warn-ink);">Draft</span>'
      : '<span class="badge-pill pill-inactive">—</span>';
    const reopenBtn = (status==='Submitted' && canReopen) ? `<button class="btn btn-sm btn-ghost" onclick="reopenEntry('${key}')">↩ Reopen (Edit)</button>` : '';
    const delDraftBtn = (status==='Draft' && (canDel||isAdmin())) ? `<button class="btn btn-sm btn-danger" title="Delete this draft" onclick="deleteOneDraft('${key}','${e.empCode}')">🗑</button>` : '';
